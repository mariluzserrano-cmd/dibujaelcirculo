const DAYS=[{"id":1,"date":"9 de noviembre","weekday":"Lunes","title":"Examíname","ref":"1.1","part":"","pages":"pp. 21–23 · capítulo íntegro","reader":"Mariluz","stage":"examiname","focus":"Comenzar con valentía","idea":"Señor, examina mi corazón.","biblia":"Salmo 139:23–24","scan_keys":["21","22","23"],"full":true,"missing":"Capítulo 1.1 completo: termina con una pregunta en la página 23. La página 24 está en blanco.","wordRef":"Salmo 139:23–24","word":"Examíname, oh, Dios, y conoce mi corazón; pruébame y conoce mis pensamientos. Ve si hay en mí camino de perversidad, y guíame en el camino eterno.","life":"Antes de pedirle respuestas a Dios, ¿estoy dispuesto a que examine mis intenciones? Esta primera oración no busca aparentar una vida perfecta; nos invita a presentarnos delante de Él con sinceridad.","prayer":"Señor, hoy no quiero esconderme detrás de mis palabras. Examina mi corazón, muéstrame lo que necesito reconocer y dame valor para escucharte. Amén.","circle":"Dibuja un círculo grande y divídelo en dos mitades: «Lo que muestro» y «Lo que Dios conoce». Escribe una palabra sincera en cada mitad. Luego elige algo pequeño que hoy necesite cambiar: una respuesta, una actitud o una disculpa pendiente. Márcalo con una estrella y ora sobre ello con Salmo 139:23–24. El reto es atreverte a reconocerlo, aunque no lo compartas con nadie."},{"id":2,"date":"10 de noviembre","weekday":"Martes","title":"Verdad o reto","ref":"1.2","part":"","pages":"pp. 25–27 · capítulo íntegro","reader":"Damaris","stage":"examiname","focus":"Verdad y confianza","idea":"La oración como conversación sincera.","biblia":"Hebreos 4:16","scan_keys":["25","26","27"],"full":true,"missing":"Capítulo 1.2 completo: termina con una pregunta en la página 27. La página 28 está en blanco.","wordRef":"Hebreos 4:16 · NTV","word":"Así que acerquémonos con toda confianza al trono de la gracia de nuestro Dios. Allí recibiremos su misericordia y encontraremos la gracia que nos ayudará cuando más la necesitemos.","life":"¿Cómo cambia mi manera de orar cuando recuerdo que puedo acercarme a Dios con confianza? Hoy nos preguntamos si hablamos con el Padre desde la sinceridad o si creemos que debemos encontrar palabras perfectas.","prayer":"Padre, enséñame a conversar contigo sin máscaras, sin temor a equivocarme y con la confianza de quien sabe que es escuchado. Amén.","circle":"Dibuja dos círculos, uno llamado «VERDAD» y otro «RETO». En el primero escribe una preocupación que no te has atrevido a nombrar delante de Dios. En el segundo anota un acto de valentía para hoy: separa cinco minutos, aléjate de las distracciones y exprésalo en voz alta con tus propias palabras. No busques una oración perfecta; habla con sinceridad."},{"id":3,"date":"11 de noviembre","weekday":"Miércoles","title":"El estado de tu corazón","ref":"1.3","part":"I","pages":"pp. 29–31 · corte antes de «Si todavía crees…»","reader":"Keishla Espiet","stage":"examiname","focus":"Mirar hacia adentro","idea":"Lo que conozco —y desconozco— de mi corazón.","biblia":"Salmo 139:23–24; Jeremías 17:9","scan_keys":["29","30","31a"],"full":true,"missing":"","wordRef":"Salmo 139:23–24","word":"Examíname, oh, Dios, y conoce mi corazón; pruébame y conoce mis pensamientos. Ve si hay en mí camino de perversidad, y guíame en el camino eterno.","life":"David sabía que incluso una persona que desea agradar a Dios necesita examinar sus motivaciones. ¿Qué parte de mi corazón me cuesta observar con honestidad?","prayer":"Señor, si algo en mis motivaciones necesita cambiar, ayúdame a verlo con humildad y a confiar en tu gracia. Amén.","circle":"Dibuja un corazón dentro de un círculo. En su interior escribe tres palabras: «Motivos», «Temores» y «Deseos». Junto a cada una anota algo que sea verdadero para ti hoy. Rodea aquello que más te cuesta admitir y dedica un momento de silencio a preguntarle a Dios qué necesitas comprender antes de actuar. Ese será tu acto de valentía: mirar sin excusas."},{"id":4,"date":"12 de noviembre","weekday":"Jueves","title":"El estado de tu corazón","ref":"1.3","part":"II","pages":"pp. 31–32 · desde «Si todavía crees…»","reader":"Nanichi","stage":"examiname","focus":"Mirar hacia adentro","idea":"Lo que conozco —y desconozco— de mi corazón.","biblia":"Salmo 139:23–24; Jeremías 17:9","scan_keys":["31b","32"],"full":true,"missing":"","wordRef":"Jeremías 17:9 · Salmo 139:23–24","word":"«El corazón humano es lo más engañoso que hay, y extremadamente perverso. ¿Quién realmente sabe qué tan malo es?» (Jeremías 17:9, NTV, citado en el capítulo).","life":"Ayer Keishla abrió la conversación sobre las motivaciones del corazón. Hoy la continuamos con una pregunta diferente: ¿qué explicaciones me doy a mí mismo para no confrontar algo que sé que debo cambiar?","prayer":"Dios, muéstrame las excusas que me repito. Dame humildad para reconocerlas y valentía para elegir la verdad. Amén.","circle":"Dibuja dos círculos que se toquen. En uno escribe «La historia que me cuento» y en el otro «La verdad que necesito reconocer». Completa una frase en cada círculo, con absoluta sinceridad. Después dibuja una flecha hacia afuera y anota una acción concreta para esta semana: corregir un hábito, pedir perdón cuando corresponda o dejar de justificar una conducta. Haz ese primer movimiento sin necesidad de exponerlo públicamente."},{"id":5,"date":"13 de noviembre","weekday":"Viernes","title":"Opciones difíciles","ref":"1.4","part":"I","pages":"pp. 33–34 · primera parte íntegra","reader":"Yasmary","stage":"examiname","focus":"Decidir con honestidad","idea":"La verdad también se demuestra en nuestras decisiones.","biblia":"Por seleccionar","scan_keys":["33","34"],"full":true,"missing":"Primera parte del 1.4: páginas 33 y 34 completas; la continuación comienza en la página 35, con Meriemil.","wordRef":"Salmo 139:23–24 · oración de David","word":"Examíname, oh, Dios, y conoce mi corazón; pruébame y conoce mis pensamientos. Ve si hay en mí camino de perversidad, y guíame en el camino eterno.","life":"Craig recuerda una etapa de juventud en la que comenzó a aprender a orar en serio, sin limitarse a la apariencia. ¿Me atrevo a pedir a Dios que examine mis verdaderas motivaciones, incluso cuando no sé qué podría descubrir?","prayer":"Señor, no quiero seguir viviendo de apariencias. Cuando pronuncie «examíname», ayúdame a escuchar con honestidad y a confiar en tu amor aun cuando descubra algo que necesite cambiar. Amén.","circle":"Dibuja un sendero que salga de tu zona de comodidad y termine en un círculo. En el camino escribe tres palabras: «apariencias», «sinceridad» y «valentía». Marca con una X el punto donde te encuentras hoy. Luego escribe una frase que te atreverás a decirle a Dios sin adornos, aunque jamás la hayas pronunciado. Dedica cinco minutos a expresarla en voz alta, en un lugar tranquilo."},{"id":6,"date":"14 de noviembre","weekday":"Sábado","title":"Opciones difíciles","ref":"1.4","part":"II","pages":"pp. 35–36 · segunda parte íntegra","reader":"Meriemil","stage":"examiname","focus":"Decidir con honestidad","idea":"La verdad también se demuestra en nuestras decisiones.","biblia":"Por seleccionar","scan_keys":["35","36"],"full":true,"missing":"Segunda parte del 1.4: empieza en la primera línea de la página 35 y termina en la página 36. Sin saltar ni repetir contenido.","wordRef":"Isaías 29:13 · citado en el capítulo","word":"Este pueblo se acerca a mí con su boca, y con sus labios me honra, pero su corazón está lejos de mí. (Isaías 29:13, citado en el libro).","life":"El autor descubrió la distancia entre su apariencia religiosa y su vida cotidiana. Examinar el corazón no es un fin en sí mismo: permite reconocer nuestra necesidad de transformación. ¿En qué decisión concreta quiero que mi fe y mi vida vuelvan a encontrarse?","prayer":"Jesús, muéstrame dónde mis palabras y mis acciones no coinciden. Concédeme humildad para reconocer lo que debo cambiar y valentía para dar un paso verdadero hacia ti. Amén.","circle":"Dibuja dos caminos que parten del mismo punto: uno se llama «Lo fácil» y el otro «Lo verdadero». Escribe en el primero una excusa que has repetido y en el segundo una decisión pequeña pero difícil que honre tu fe. Rodea esa decisión y anota cuándo darás el primer paso. No tienes que publicarla: lo peligroso es atreverte a hacerla."},{"id":7,"date":"15 de noviembre","weekday":"Domingo","title":"Revela mis miedos","ref":"1.5","part":"I","pages":"pp. 37–39 · primera parte íntegra","reader":"Ivoncita","stage":"examiname","focus":"Nombrar el miedo","idea":"La valentía comienza cuando dejo de esconder mis temores.","biblia":"Por seleccionar","scan_keys":["37","38","39"],"full":true,"missing":"Primera parte: páginas 37–39, sin omisiones. La continuación comienza en la página 40.","wordRef":"Salmo 139:23 · oración de David","word":"Examíname, oh, Dios, y conoce mi corazón; pruébame y conoce mis pensamientos.","life":"El autor explora cómo nuestros pensamientos ansiosos pueden revelar aquello que tememos perder y aquello que intentamos controlar. Sin culparnos por sentir ansiedad, podemos preguntarnos qué preocupación necesitamos poner en palabras delante de Dios.","prayer":"Padre, dame valor para nombrar lo que me preocupa sin vergüenza. Acompáñame en mi incertidumbre, enséñame a pedir ayuda y a confiar en ti mientras hago lo que me corresponde. Amén.","circle":"Dibuja un círculo alrededor de una nube. En la nube escribe un temor que te visite con frecuencia. Traza dos flechas: «Lo que puedo hacer hoy» y «Lo que necesito entregar a Dios». Escribe una acción realista junto a la primera y una oración breve junto a la segunda. Si esa preocupación es intensa, también puedes pedir acompañamiento a alguien de confianza."},{"id":8,"date":"16 de noviembre","weekday":"Lunes","title":"Revela mis miedos","ref":"1.5","part":"II","pages":"pp. 40–41 · segunda parte íntegra","reader":"Lizbeth Hernández","stage":"examiname","focus":"Nombrar el miedo","idea":"La valentía comienza cuando dejo de esconder mis temores.","biblia":"Por seleccionar","scan_keys":["40","41"],"full":true,"missing":"Segunda parte: páginas 40–41. La página 40 termina en «con» y el texto continúa en la 41 con «mentiras». El capítulo concluye con «Confía en Él».","wordRef":"2 Timoteo 1:7; 1 Juan 4:18 · citados en el capítulo","word":"Dios nos ha dado un espíritu de poder, amor y autodisciplina (2 Timoteo 1:7, NTV, citado en el capítulo).","life":"La fe no significa ausencia de miedo. En el capítulo, el autor invita a reconocer el temor y seguir avanzando sin permitir que determine todas nuestras decisiones. ¿Qué decisión prudente puedo tomar desde el amor y la confianza?","prayer":"Señor, que mis miedos no dicten mis pasos. Recuérdame tu amor, fortalece mi fe y ayúdame a avanzar con sabiduría, sin negar lo que siento ni caminar sin apoyo. Amén.","circle":"Dibuja dos círculos concéntricos. En el interior escribe «Mi mayor temor»; en el exterior «Un paso de fe». Anota una acción pequeña, concreta y segura que hayas estado postergando. Coloca una fecha junto a ella. Después ora por valentía y considera con quién puedes compartir la carga si la necesitas."},{"id":9,"date":"17 de noviembre","weekday":"Martes","title":"Descubre mis pecados","ref":"1.6","part":"I","pages":"pp. 43–47 · primera parte íntegra","reader":"Lymari Ortiz","stage":"examiname","focus":"Reconocer para transformar","idea":"Mirar con gracia aquello que necesito rendir.","biblia":"Por seleccionar","scan_keys":["43","44","45","46","47"],"full":true,"missing":"Primera parte completa: páginas 43–47, incluida la oración que continúa de una página a la siguiente. La lectura concluye en «Y las justificaciones continúan».","wordRef":"Proverbios 12:15 · citado en la página 46","word":"El camino del necio es derecho en su opinión; mas el que obedece al consejo es sabio.","life":"El capítulo nos confronta con una pregunta difícil: cuando alguien que nos ama advierte algo que podríamos cambiar, ¿lo escuchamos o buscamos cómo justificarnos? El autor cuenta cómo el uso de su teléfono lo llevó a perderse momentos importantes con su familia. Reconocer una conducta no significa condenarnos: puede ser el comienzo de un cambio verdadero.","prayer":"Señor, ayúdame a escuchar con humildad las advertencias hechas con amor. Revela las excusas con las que evito reconocer mis errores y dame valor para enmendar mis acciones. Enséñame a cuidar lo que verdaderamente importa. Amén.","circle":"Dibuja un círculo y, dentro de él, escribe «Lo que justifico». A su alrededor traza tres pequeñas ventanas: «Lo que otros han observado», «Lo que siento cuando me lo dicen» y «Lo que puedo cambiar». Elige una conducta concreta, sin exponer información privada, y dibuja una flecha hacia un primer paso: escuchar sin interrumpir, pedir una opinión honesta o cambiar un hábito durante 24 horas. Ora antes de dar ese paso."},{"id":10,"date":"18 de noviembre","weekday":"Miércoles","title":"Descubre mis pecados","ref":"1.6","part":"II","pages":"pp. 48–51 · segunda parte íntegra","reader":"Carla Chuchi","stage":"examiname","focus":"Reconocer para transformar","idea":"Mirar con gracia aquello que necesito rendir.","biblia":"Por seleccionar","scan_keys":["48","49","50","51"],"full":true,"missing":"Segunda parte completa: páginas 48–51. La lectura continúa con los ejemplos de justificaciones y termina en «aceptar la dolorosa verdad». El capítulo concluye en la página 51; la página 52 no se ha fotografiado, y el capítulo siguiente comienza en la 53 según el índice.","wordRef":"Salmo 139:23–24 · oración central del capítulo","word":"Examíname, oh, Dios, y conoce mi corazón; pruébame y conoce mis pensamientos. Ve si hay en mí camino de perversidad, y guíame en el camino eterno.","life":"El autor muestra cómo las excusas pueden impedirnos reconocer una verdad incómoda. También relata que un consejo expresado con amor lo ayudó a abrirse a la corrección. ¿Qué diferencia existe entre justificar mis acciones y responsabilizarme por ellas? La transformación puede comenzar con la disposición a escuchar.","prayer":"Dios, muéstrame aquello en lo que necesito corregir el rumbo. Quita de mí la necesidad de tener siempre la razón. Que tu verdad me lleve a la humildad, a reparar el daño cuando corresponda y a crecer en amor. Amén.","circle":"Dibuja dos círculos que se crucen: «Mi excusa» y «Mi responsabilidad». En la intersección escribe «La verdad que necesito aceptar». Después, sin publicar tu respuesta, escribe una reparación posible: reconocer un error, pedir perdón, escuchar una observación o cambiar una manera de tratar a alguien. Coloca una fecha para ese acto y dibuja una pequeña llama que simbolice tu valentía."},{"id":11,"date":"19 de noviembre","weekday":"Jueves","title":"Guíame","ref":"1.7","part":"I","pages":"pp. 53–55 · hasta «idolatría» (p. 55, primer párrafo)","reader":"Sandra","stage":"examiname","focus":"Aprender a escuchar","idea":"La guía se vuelve camino cuando damos el siguiente paso.","biblia":"Por seleccionar","scan_keys":["53","54","55a"],"full":true,"missing":"Primera parte del capítulo 1.7: páginas 53 y 54 completas más el primer párrafo de la 55, que termina en «idolatría». No interrumpir la oración entre páginas 54 y 55.","wordRef":"Salmo 139:23–24 · oración que articula el capítulo","word":"Examíname, oh, Dios, y conoce mi corazón; pruébame y conoce mis pensamientos. Ve si hay en mí camino de perversidad, y guíame en el camino eterno.","life":"El capítulo reúne las preguntas de toda la primera parte del libro: examinar el corazón, reconocer los pensamientos ansiosos, descubrir las conductas que necesitan corrección y pedir dirección. El autor admite que el deseo de agradar a los demás había ocupado un lugar desmedido en su vida. ¿De quién estoy buscando la aprobación al tomar mis decisiones?","prayer":"Dios, examina mis motivaciones y muéstrame dónde busco más la aprobación de las personas que tu dirección. Dame humildad para reconocerlo y valor para caminar por el camino que me muestras. Amén.","circle":"Dibuja un círculo con cuatro puertas. Escribe en cada una: «Examíname», «Muéstrame mis temores», «Revela mis faltas» y «Guíame». En el centro dibuja una brújula. Identifica una decisión concreta en la que estás eligiendo agradar a otros antes que actuar con integridad. Escribe un paso pequeño que puedas dar esta semana para actuar de acuerdo con tu fe, aunque nadie te aplauda."},{"id":12,"date":"20 de noviembre","weekday":"Viernes","title":"Guíame","ref":"1.7","part":"II","pages":"pp. 55–57 · desde «Entonces pido a Dios...» (p. 55)","reader":"Keila","stage":"examiname","focus":"Aprender a escuchar","idea":"La guía se vuelve camino cuando damos el siguiente paso.","biblia":"Por seleccionar","scan_keys":["55b","56","57"],"full":true,"missing":"Segunda parte del capítulo 1.7: comienza en el segundo párrafo de la página 55, «Entonces pido a Dios ahora...», y concluye con «Examíname, Señor» en la 57. Se incluye la continuación de la frase interrumpida entre las páginas 55 y 56.","wordRef":"Salmo 139:24 · invitación final de la primera parte","word":"Ve si hay en mí camino de perversidad, y guíame en el camino eterno.","life":"La segunda voz continúa con una decisión: pedirle a Dios que cambie nuestra manera de vivir. El relato de Mandy introduce una perspectiva sobre aceptar situaciones difíciles y encontrar oportunidades de servir. ¿Cómo puedo pasar de reconocer mi necesidad a dar un paso real, sin fingir que mis dificultades no existen?","prayer":"Señor, no quiero detenerme en lo que descubro de mí. Ayúdame a responder a tu guía con amor, sabiduría y perseverancia. Cuando me sienta débil, recuérdame que puedo buscar tu fortaleza y también apoyo en las personas que me acompañan. Amén.","circle":"Dibuja una brújula grande y escribe en el centro «Guíame». En el norte anota una decisión que requiere valentía; en el sur, un temor que te detiene; en el este, una persona confiable que pueda acompañarte; y en el oeste, una actitud que estás dispuesto a dejar atrás. Elige un solo paso concreto y dibuja una huella hacia él. Ese será tu acto de obediencia, sin necesidad de compartir la respuesta."},{"id":13,"date":"21 de noviembre","weekday":"Sábado","title":"Quebrántame","ref":"2.1","part":"I","pages":"pp. 61–62 · hasta «Tiene sentido, ¿verdad?» (p. 62)","reader":"Marco A. Colón","stage":"quebrantame","focus":"Orar por bendición y protección","idea":"Reconocer nuestras peticiones sin escondernos.","biblia":"1 Corintios 11:24 · Santiago 1:2–4","scan_keys":["61","62a"],"full":true,"missing":"Primera parte del 2.1: página 61 y primer párrafo de la 62. Continúa la oración de la 61 («dame más de lo») con el inicio de la 62 («que quiero»). Termina después de «Tiene sentido, ¿verdad?». Richard prosigue en el segundo párrafo de la 62.","wordRef":"1 Corintios 11:24 · epígrafe de la segunda parte, «Quebrántame»","word":"Y habiendo dado gracias [Jesús], lo partió [el pan], y dijo: «Tomad, comed; esto es mi cuerpo que por vosotros es partido; haced esto en memoria de mí».","life":"Craig Groeschel recuerda la oración de Jabes, que pide bendición, protección y acompañamiento. ¿Por qué es natural que pidamos a Dios seguridad y bienestar? ¿Qué hay detrás de mis propias peticiones cuando oro?","prayer":"Señor, gracias por escuchar mis necesidades. Hoy te hablo sin fingir fortaleza: necesito tu cuidado, tu provisión y tu compañía. Abre mi corazón para escuchar también aquello que quieres enseñarme. Amén.","circle":"Dibuja un círculo y escribe dentro tres peticiones que haces frecuentemente a Dios. Junto a cada una anota qué necesidad o temor hay detrás. Dibuja una pequeña puerta en el borde del círculo y escribe: «Estoy dispuesto a escucharte». Durante cinco minutos conversa con Dios sin repetir tus frases habituales; termina dejando un minuto de silencio."},{"id":14,"date":"22 de noviembre","weekday":"Domingo","title":"Quebrántame","ref":"2.1","part":"II","pages":"pp. 62–63 · desde «Aunque he orado...» (p. 62)","reader":"Richard","stage":"quebrantame","focus":"La madurez que puede surgir de las pruebas","idea":"Las oraciones peligrosas nos invitan a crecer, no a buscar sufrimiento.","biblia":"Santiago 1:2–4 · 1 Corintios 11:24","scan_keys":["62b","63"],"full":true,"missing":"Segunda parte del 2.1: segundo párrafo de la página 62 («Aunque he orado diferentes versiones...») hasta el final de la página 63 («pedirle a Dios que te quebrante»). La página 64 no se ha facilitado en fotografía; el índice inicia el capítulo 2.2 en la 65.","wordRef":"Santiago 1:2–4 · citado en la lectura","word":"Las pruebas de la fe pueden cultivar perseverancia y madurez. (Síntesis de Santiago 1:2–4; lee el pasaje completo en el texto del libro).","life":"Ayer Marco nos presentó la oración de Jabes, tan comprensible para quienes deseamos protección y bienestar. Hoy el autor nos desafía a considerar la madurez que puede surgir al enfrentar pruebas con fe. Quebrantarse no significa buscar daño ni resignarse ante abusos: es abrirse a la transformación que Dios puede obrar incluso en tiempos difíciles.","prayer":"Padre, tú conoces mis luchas y mis límites. Concédeme fortaleza, sabiduría y apoyo para atravesar los desafíos. Que las pruebas no me endurezcan, sino que me ayuden a crecer en compasión, perseverancia y confianza en ti. Amén.","circle":"Dibuja un círculo atravesado por una línea que lo divide en dos. A la izquierda escribe «Lo que pido que Dios quite»; a la derecha, «Lo que puedo aprender». Escribe una dificultad real y una virtud que puedes cultivar sin exponerte al daño. Haz una acción concreta —pedir acompañamiento, reparar algo, dar una ayuda— y dibuja una llama al lado de ese paso."},{"id":15,"date":"23 de noviembre","weekday":"Lunes","title":"Rompe tu burbuja","ref":"2.2","part":"","pages":"pp. 65–68","reader":"Medeline","stage":"quebrantame","focus":"Abandonar la zona de comodidad","idea":"Lo que Dios puede enseñarnos cuando nuestra burbuja se rompe.","biblia":"Por asignar","scan_keys":[],"full":false,"missing":"Lectura del capítulo 2.2 pendiente de recibir las fotografías de las páginas 65–68.","wordRef":"Pendiente de digitalización del capítulo 2.2"},{"id":16,"date":"24 de noviembre","weekday":"Martes","title":"Statu quo","ref":"2.3","part":"","pages":"pp. 69–72","reader":"Betsy Serrano","stage":"quebrantame","focus":"Desafiar la inercia espiritual","idea":"Dejar de conformarnos con lo de siempre.","biblia":"Por asignar","scan_keys":[],"full":false,"missing":"Lectura del capítulo 2.3 pendiente de recibir las fotografías de las páginas 69–72.","wordRef":"Pendiente de digitalización del capítulo 2.3"},{"id":17,"date":"25 de noviembre","weekday":"Miércoles","title":"Quebrantado y liberado","ref":"2.4","part":"","pages":"pp. 73–76 · capítulo 2.4 íntegro","reader":"Keila","stage":"quebrantame","focus":"Reconocer la libertad que nace de una transformación profunda","idea":"Quebrantamiento y renovación.","biblia":"Marcos 14:3–9","scan_keys":["73","74","75","76"],"full":true,"missing":"Páginas 73–76 transcritas de las fotografías facilitadas. Las notas de margen aparecen separadas para evitar lecturas duplicadas.","wordRef":"Marcos 14:3–9","life":"En Marcos 14, una mujer quiebra un frasco valioso para honrar a Jesús. Craig Groeschel presenta esa entrega como imagen de una decisión sin marcha atrás. ¿Qué sigo guardando por miedo, vergüenza o necesidad de control? ¿Cómo puedo comenzar a entregárselo a Dios y buscar el apoyo que necesito?","prayer":"Señor Jesús, así como aquella mujer ofreció lo que tenía, hoy quiero abrirte las manos y el corazón. Muéstrame qué necesito soltar para caminar en verdad, dignidad y libertad. Dame valentía y sabiduría para dar un paso concreto de entrega. Amén.","circle":"Dibuja un frasco de alabastro dentro de tu círculo. Escribe en él, solo para ti, algo del pasado que te pesa o una seguridad a la que te aferras. Después dibuja el frasco abierto y anota una acción pequeña de libertad: pedir apoyo, reparar una relación, poner un límite sano o entregar a Dios un temor. No tienes que compartirlo con nadie."},{"id":18,"date":"26 de noviembre","weekday":"Jueves","title":"Fracción del pan","ref":"2.5","part":"I","pages":"pp. 77–79 · termina antes de «Nuestros amigos Jerome y Shanna»","reader":"Yamira","stage":"quebrantame","focus":"El pan partido: amor y entrega","idea":"Jesús comparte el pan y nos enseña a vivir para los demás.","biblia":"Marcos 14:22–24","scan_keys":["77","78","79a"],"full":true,"missing":"","wordRef":"Marcos 14:22–24","word":"Jesús tomó pan y bendijo, y lo partió y les dio, diciendo: «Tomad, esto es mi cuerpo».","life":"En la mesa, Jesús partió el pan y habló de su vida entregada. El capítulo nos invita a ver la comunión no solo como memoria, sino también como una forma de vivir con generosidad. ¿Qué puedo ofrecer hoy por amor sin descuidar mis propios límites y necesidades?","prayer":"Jesús, gracias por el amor con que te entregaste. Enséñame a reconocer tu presencia en la mesa y a compartir con otros lo que he recibido. Amén.","circle":"Dibuja un pan partido en dos. En una mitad escribe «lo que recibo» y en la otra «lo que puedo compartir». Escoge un gesto concreto de servicio y hazlo hoy con alegría."},{"id":19,"date":"27 de noviembre","weekday":"Viernes","title":"Fracción del pan","ref":"2.5","part":"II","pages":"pp. 79–81 · desde «Nuestros amigos Jerome y Shanna» hasta el final","reader":"Mariluz","stage":"quebrantame","focus":"Quebrantados y derramados por amor","idea":"La entrega cotidiana puede convertirse en bendición para otros.","biblia":"Lucas 22:19; Mateo 16:24–25","scan_keys":["79b","80","81"],"full":true,"missing":"","wordRef":"Lucas 22:19; Mateo 16:24–25","word":"Haced esto en memoria de mí.","life":"La lectura invita a dejar de vivir únicamente para nuestros propios planes y a servir con humildad. No se trata de buscar el sufrimiento ni de soportar daño, sino de preguntarnos cómo vivir una entrega generosa y libre, siguiendo el amor de Jesús.","prayer":"Señor Jesús, enséñame a discernir dónde puedo servir con amor, humildad y sabiduría. Ayúdame a transformar mis dificultades en compasión, sin perder de vista mi dignidad y mi cuidado. Amén.","circle":"Dibuja un círculo con dos palabras: «recibir» y «dar». Escribe una acción pequeña mediante la cual puedas compartir tiempo, escucha o ayuda esta semana. Ora: «Señor, muéstrame cómo amar mejor»."},{"id":20,"date":"28 de noviembre","weekday":"Sábado","title":"Caja sorpresa","ref":"2.6","part":"","pages":"pp. 83–85 · fotografías aportadas (p. 86 sin verificar)","reader":"Damaris","stage":"quebrantame","focus":"Ser sorprendidos","idea":"Abrirnos a lo inesperado con confianza.","biblia":"2 Corintios 12:9","scan_keys":["83","84","85"],"full":false,"missing":"Páginas 83–85 recibidas y transcritas. Falta confirmar si la 86 está en blanco.","wordRef":"2 Corintios 12:9 · RVR1960 · lectura sugerida","word":"Bástate mi gracia; porque mi poder se perfecciona en la debilidad.","life":"Craig describe cómo empezó a vivir esperando el dolor como si fuera una caja sorpresa que podía abrirse en cualquier momento. Su experiencia nos deja una pregunta importante: ¿estoy confundiendo confiar en Dios con vivir anticipando una desgracia? Las dificultades pueden enseñarnos y acercarnos a Jesús, pero no necesitamos buscar sufrimiento ni aceptar maltrato para crecer. La gracia de Dios también nos sostiene en nuestra fragilidad, incluso cuando todavía no entendemos lo que vivimos.","prayer":"Señor Jesús, hoy te entrego mis miedos a lo inesperado. Si atravieso momentos difíciles, acompáñame con tu gracia y enséñame a discernir, pedir ayuda y crecer sin perder la paz ni la esperanza. Amén.","circle":"Dibuja una caja dentro de tu círculo. Escribe afuera «lo que temo que suceda» y adentro «lo que hoy sí puedo confiarle a Dios». Elige una preocupación real, nómbrala en oración y realiza un pequeño paso de cuidado o confianza, en lugar de pasar el día esperando que algo malo ocurra."},{"id":21,"date":"29 de noviembre","weekday":"Domingo","title":"Camino equivocado","ref":"2.7","part":"","pages":"pp. 87–88","reader":"Keishla Espiet","stage":"quebrantame","focus":"Cambiar de dirección","idea":"Reconocer cuándo un camino necesita corregirse.","biblia":"Romanos 12:18","scan_keys":["87","88"],"full":true,"missing":"","life":"Craig comparte el dolor de una amistad herida y de una conversación de reconciliación que quedó pendiente. Al escuchar su historia, podemos preguntarnos cómo respondemos cuando estamos dolidos y qué necesitamos entregarle a Jesús para hablar con humildad. Romanos 12 nos invita a buscar la paz y reconoce los límites de lo que depende de cada persona. Hoy puedo reconocer una palabra que hirió, escuchar con atención o pedir acompañamiento. El desenlace de esta historia merece compasión y respeto por un dolor que el relato apenas permite conocer. Podemos llevar ante Dios tanto lo que deseamos reparar como las pérdidas que todavía nos duelen, y permitir que nuestra comunidad nos acompañe.","prayer":"Señor Jesús, examina mi manera de responder cuando me siento herida. Dame humildad para reconocer mis errores, serenidad para escuchar y sabiduría para buscar la paz. Acompáñame en las conversaciones pendientes y en los duelos que llevo dentro. Enséñame a recibir ayuda y a ofrecer una presencia compasiva. Hoy te entrego mi orgullo, mi dolor y aquello que está fuera de mis manos. Amén.","wordRef":"Romanos 12:18 · Reina-Valera 1960 · lectura sugerida","circle":"Dibuja un círculo y escribe «Jesús, guíame hacia la paz» en el centro. Dentro, anota una actitud propia que deseas entregarle, como responder con dureza, guardar resentimiento o aislarte cuando te duele algo. Junto a ella, escribe una acción que sí dependa de ti. Pregúntate «¿Qué pequeño paso de paz y cuidado puedo dar hoy?». Elige escuchar con calma, pedir perdón por una palabra concreta o buscar acompañamiento de alguien de confianza. Si una conversación requiere distancia o preparación, empieza por escribir lo que necesitas expresar y pedir consejo. Traza una flecha desde tu actitud hacia ese paso y fija un momento para realizarlo. Cierra orando «Jesús, acompáñame a dar este paso contigo». Guarda los nombres y detalles personales en tu libreta.","word":"Si es posible, en cuanto dependa de vosotros, estad en paz con todos los hombres."},{"date":"30 de noviembre","weekday":"Lunes","title":"Unidos por el quebrantamiento","ref":"2.8","part":"I","reader":"Nanichi","stage":"quebrantame","id":22,"pages":"pp. 89–90 · hasta «destrozado, roto, marcado»","scan_keys":["89","90"],"full":true,"missing":"","biblia":"Romanos 12:15","wordRef":"Romanos 12:15 · Reina-Valera 1909 · lectura sugerida","word":"Gozaos con los que se gozan: llorad con los que lloran.","focus":"Acompañarnos en el dolor","idea":"Dar espacio al duelo y recibir compañía.","life":"La historia muestra cómo una pérdida atraviesa a una familia y a toda una comunidad. Craig expresa dolor, preguntas y culpa desde su experiencia personal. Al escucharlo, podemos hacer espacio para los sentimientos que aparecen en el duelo y tratarnos con compasión. Jesús nos invita a acercarnos a quien llora y a permitir que alguien se acerque a nosotros. A veces acompañar consiste en escuchar, preparar una comida o estar presentes en silencio. ¿Qué necesito compartir con alguien de confianza y qué ayuda concreta puedo ofrecer hoy?","prayer":"Señor Jesús, acompaña a quienes están de duelo. Recibe nuestras lágrimas, nuestras preguntas y lo que todavía cuesta decir. Dame sensibilidad para escuchar y humildad para aceptar ayuda. Enséñanos a sostenernos con paciencia y ternura. Amén.","circle":"Dibuja un círculo y escribe en el centro «Jesús, acompáñanos en el dolor». Dentro, anota una necesidad que quieras confiarle hoy. En el borde, dibuja una mano y escribe una forma concreta de acompañamiento que puedas ofrecer o pedir. Pregúntate «¿Qué gesto de cuidado puedo realizar hoy?». Elige llamar para escuchar, llevar una comida o pedir un momento de compañía. Acuerda ese gesto con la persona, respetando sus tiempos. Guarda los detalles personales en tu libreta y termina orando por quienes necesitan consuelo."},{"date":"1 de diciembre","weekday":"Martes","title":"Unidos por el quebrantamiento","ref":"2.8","part":"II","reader":"Yasmary","stage":"quebrantame","id":23,"pages":"pp. 91–92 · desde «Entre lágrimas» hasta el final","scan_keys":["91","92"],"full":true,"missing":"","biblia":"Gálatas 6:2","wordRef":"Gálatas 6:2 · Reina-Valera 1909 · lectura sugerida","word":"Sobrellevad los unos las cargas de los otros; y cumplid así la ley de Cristo.","focus":"Recibir y ofrecer apoyo","idea":"La vulnerabilidad compartida abre espacio a una comunidad de gracia.","life":"Craig se atreve a decir que necesita amor, gracia y amigos. La comunidad responde acercándose y acompañándolo. Esa escena nos invita a preguntarnos si damos espacio para que las personas expresen sus necesidades con libertad. Podemos construir confianza al escuchar con respeto, cuidar lo que alguien nos comparte y ofrecer ayuda que podamos sostener. También podemos permitirnos recibir. En nuestra ronda, entregar la autosuficiencia a Jesús puede comenzar con una petición sencilla de compañía y un compromiso concreto de cuidado mutuo.","prayer":"Jesús, transforma mi orgullo y mi temor a mostrarme vulnerable. Ayúdame a expresar mis necesidades con honestidad y a recibir el amor de quienes me acompañan. Haz de nuestra comunidad una familia que escuche, cuide y comparta las cargas con sabiduría. Guíanos hacia una ayuda concreta y fiel. Amén.","circle":"Dibuja dos círculos que se toquen. En uno escribe «La ayuda que necesito» y en el otro «La ayuda que puedo ofrecer». En la unión escribe «Jesús nos reúne». Anota una petición y una acción pequeña que puedas sostener esta semana. Pregúntate «¿A quién puedo acercarme con confianza y cómo puedo acompañar con respeto?». Elige una persona, pide permiso para conversar y acuerden un paso concreto, como una llamada, una visita o ayuda con una tarea. Ora por ese encuentro y conserva en privado lo que te confíen."},{"id":24,"date":"2 de diciembre","weekday":"Miércoles","title":"Bendecidos por el quebrantamiento","ref":"2.9","part":"I","pages":"pp. 93–95 · hasta «y dependen de él»","reader":"Meriemil","stage":"quebrantame","focus":"Recibir gracia y compartir esperanza","idea":"Reconocer nuestra fragilidad y abrirnos al cuidado y al servicio.","biblia":"2 Corintios 12:9","scan_keys":["93","94","95a"],"full":true,"missing":"","wordRef":"2 Corintios 12:9 · Reina-Valera 1960 · lectura sugerida","word":"Bástate mi gracia; porque mi poder se perfecciona en la debilidad.","life":"La experiencia de John muestra cuánto puede permanecer oculto detrás de una apariencia de fortaleza. Craig descubre a un amigo que necesita consuelo y que encuentra esperanza en su relación con Dios y en el servicio compartido. Podemos preguntarnos qué nos cuesta reconocer y qué ayuda necesitamos recibir. La gracia de Jesús nos invita a acercarnos con honestidad, cuidar nuestra vida y acompañar con ternura a otros. Hoy podemos elegir un gesto de servicio acorde con nuestras fuerzas y dejar que alguien nos cuide también.","prayer":"Señor Jesús, recibe mi cansancio y mis límites. Ayúdame a confiar en tu gracia, a pedir el cuidado que necesito y a reconocer el bien que puedo compartir. Dame sensibilidad para acompañar a quienes sufren y humildad para recibir compañía. Que mi servicio nazca de tu amor. Amén.","circle":"Dibuja un círculo y escribe en el centro «Tu gracia me sostiene». En un lado anota una necesidad que puedas reconocer ante Jesús; en el otro, un gesto de cuidado que puedas recibir u ofrecer. Pregúntate «¿Qué paso pequeño me ayudaría a vivir acompañado hoy?». Elige pedir escucha, aceptar ayuda con una tarea o dedicar un momento a alguien que necesita compañía. Ponle una hora posible y ora por ese encuentro. Guarda los detalles personales en tu libreta."},{"id":25,"date":"3 de diciembre","weekday":"Jueves","title":"Bendecidos por el quebrantamiento","ref":"2.9","part":"II","pages":"pp. 95–98 · desde «Durante la última cena» hasta «Quebrántame, Señor»","reader":"Lymari Ortiz","stage":"quebrantame","focus":"Responder cada día al amor de Jesús","idea":"Recibir su gracia y convertir la entrega en decisiones cotidianas.","biblia":"Juan 21:17","scan_keys":["95b","96","97","98"],"full":false,"missing":"Páginas 95–98 recibidas y transcritas. El texto fotografiado cierra con «Quebrántame, Señor». Las páginas 99 y 100 de la planificación inicial no fueron aportadas.","wordRef":"Juan 21:17 · Reina-Valera 1960 · fragmento para leer junto a Juan 21:15–19","word":"Señor, tú lo sabes todo; tú sabes que te amo.","life":"La historia de Pedro nos permite contemplar una vida que vuelve a responder al amor de Jesús después de haber fallado. En Juan 21, Jesús lo invita de nuevo a cuidar de otros. Podemos reconocer nuestros errores, recibir gracia y dar un paso de reparación. La entrega diaria toma forma en decisiones concretas, como escuchar antes de responder, actuar con honestidad o compartir tiempo con generosidad. ¿Qué actitud quiero entregarle hoy a Jesús y qué acción puede expresar ese cambio?","prayer":"Jesús, tú conoces mi corazón. Recibe mis errores y enséñame a volver a ti con confianza. Transforma mi orgullo y mi egoísmo en humildad y generosidad. Guíame para reparar lo que pueda reparar y elegir cada día una forma concreta de amar. Sostén mi vida con tu gracia. Amén.","circle":"Dibuja un círculo con una flecha que vuelva al centro. Escribe allí «Jesús, hoy vuelvo a ti». Sobre la flecha, anota una actitud que deseas transformar y una acción que la reemplace, como pasar de interrumpir a escuchar o de posponer una disculpa a reconocer un error. Pregúntate «¿Cómo puedo responder hoy al amor de Jesús?». Elige un paso realizable y un momento para hacerlo. Al terminar el día, vuelve al círculo, agradece la ayuda recibida y anota qué deseas seguir practicando mañana."},{"id":26,"date":"4 de diciembre","weekday":"Viernes","title":"Envíame","ref":"3.1","part":"","pages":"pp. 101–103 · fotografías recibidas; p. 104 por confirmar","reader":"Carla Chuchi","stage":"enviame","focus":"Ofrecer nuestra disponibilidad","idea":"Responder al llamado de Dios con una acción concreta de servicio.","biblia":"Isaías 6:8","scan_keys":["101","102","103"],"full":false,"missing":"Páginas 101–103 recibidas y transcritas, con cierre en «Envíame, Señor. Úsame». No se recibió la página 104 de la planificación inicial.","wordRef":"Isaías 6:8 · NTV · texto de la apertura fotografiada","word":"Después oí que el Señor preguntaba: «¿A quién enviaré como mensajero a este pueblo? ¿Quién irá por nosotros?».\n—Aquí estoy yo —le dije—. Envíame a mí.","life":"Comenzamos la tercera parte de la ronda con una pregunta que abre nuestra oración hacia los demás. Podemos confiar a Dios nuestras necesidades y ofrecerle también nuestro tiempo, nuestras capacidades y nuestra disposición a servir. Isaías responde «Aquí estoy yo». Esa disponibilidad puede comenzar cerca, al escuchar a alguien, compartir una habilidad o ayudar con una tarea. Jesús nos enseña a mirar a las personas con amor y a responder con humildad. ¿Qué necesidad puedo atender hoy con lo que tengo y con las fuerzas de las que dispongo?","prayer":"Señor Jesús, aquí estoy. Te confío mis necesidades y pongo a tu disposición mi tiempo, mis manos y mis capacidades. Abre mis ojos para reconocer a quien necesita compañía o ayuda. Dame sabiduría para escuchar, humildad para aprender y valor para dar un paso concreto de servicio. Envíame y enséñame a amar como tú. Amén.","circle":"Dibuja un círculo y escribe en el centro «Aquí estoy, envíame». Alrededor, anota tres cosas que puedes ofrecer, como tiempo, escucha o una habilidad. Traza una flecha hacia una necesidad concreta de tu entorno. Pregúntate «¿A quién puedo servir hoy y qué puedo ofrecer de verdad?». Elige una acción pequeña, pregunta a la persona si esa ayuda le sirve y acuerda un momento para realizarla. Al final del día, vuelve a tu círculo y escribe qué aprendiste al escuchar y servir. Conserva los nombres y detalles personales en tu libreta."},{"id":27,"date":"5 de diciembre","weekday":"Sábado","title":"Cuando Dios te llame, responde","ref":"3.2","part":"I","pages":"pp. 105–108 · hasta «Aquí estoy, Señor. No voy a ir»","reader":"Sandra","stage":"enviame","focus":"Reconocer nuestra respuesta al llamado","idea":"Escuchar con honestidad y dar un paso de disponibilidad.","biblia":"Jonás 1:2–3","scan_keys":["105","106","107","108a"],"full":true,"missing":"","wordRef":"Jonás 1:2 · fragmento citado en el capítulo · Reina-Valera 1960","word":"Ve a Nínive, aquella gran ciudad, y pregona contra ella; porque ha subido su maldad delante de mí.","life":"La lectura nos invita a reconocer cómo respondemos cuando aparece una oportunidad de servir. Jonás cuenta con habilidades, pero se resiste a ir; Craig recuerda una ocasión en que siguió de largo ante una persona que parecía necesitar ayuda. Podemos examinar nuestras propias respuestas con honestidad y pedir a Jesús un corazón atento. Discernir una necesidad incluye escuchar a la persona y considerar cómo ayudar con prudencia. ¿Qué gesto de amor estoy postergando y qué paso concreto puedo dar hoy?","prayer":"Señor Jesús, abre mis ojos a las necesidades que tengo cerca. Ayúdame a reconocer mis excusas, escuchar con atención y responder con amor y prudencia. Te entrego mi comodidad y mis temores. Guía mis pasos para ofrecer una ayuda concreta y respetuosa. Amén.","circle":"Dibuja un círculo y escribe en el centro «Jesús, ayúdame a responder». Dentro, anota una oportunidad de servicio que has postergado y la razón que te ha frenado. Traza una flecha hacia un paso pequeño que puedas realizar hoy. Pregúntate «¿Qué puedo hacer para acercarme y escuchar?». Puede ser preguntar qué ayuda necesita alguien, ofrecer compañía o colaborar con una tarea. Acuerda la ayuda con la persona y pon un momento para realizarla. Al terminar, vuelve al círculo y escribe lo que aprendiste."},{"id":28,"date":"6 de diciembre","weekday":"Domingo","title":"Cuando Dios te llame, responde","ref":"3.2","part":"II","pages":"pp. 108–109 · desde «La segunda respuesta» hasta «Envíame a mí»","reader":"Richard","stage":"enviame","focus":"Ofrecer disponibilidad con confianza","idea":"Presentar nuestras inseguridades a Dios y disponernos a servir.","biblia":"Isaías 6:8","scan_keys":["108b","109"],"full":true,"missing":"","wordRef":"Isaías 6:8b · NTV · fragmento citado en el capítulo","word":"Aquí estoy yo. Envíame a mí.","life":"Moisés expresa sus inseguridades ante el llamado. Isaías ofrece su disponibilidad. Estas respuestas nos ayudan a poner en palabras nuestros temores y a preguntarnos qué necesitamos aprender para servir. Podemos comenzar con lo que tenemos, pedir orientación y aceptar acompañamiento. La confianza en Jesús puede expresarse en una respuesta sencilla y responsable. ¿Qué capacidad puedo poner al servicio de alguien y qué apoyo necesito para dar ese paso?","prayer":"Jesús, aquí estoy. Tú conoces mis capacidades, mis dudas y lo que todavía necesito aprender. Dame humildad para pedir orientación y confianza para ofrecer lo que tengo. Ayúdame a discernir dónde puedo servir y a responder con generosidad. Envíame y acompáñame en el paso de hoy. Amén.","circle":"Dibuja un círculo con las palabras «Aquí estoy» en el centro. A un lado escribe una inseguridad que deseas confiarle a Jesús; al otro, una capacidad que puedes compartir. Une ambas con una flecha y anota una acción concreta de servicio. Pregúntate «¿Qué apoyo me ayudaría a comenzar?». Elige a alguien de confianza a quien pedir orientación y acuerda un primer paso para esta semana. Cierra orando «Jesús, cuenta conmigo y enséñame a servir». Guarda los detalles personales en tu libreta."},{"id":29,"date":"7 de diciembre","weekday":"Lunes","title":"Gloria a Dios","ref":"3.3","part":"I","pages":"pp. 111–113 · hasta «dan a Dios por sentado»","reader":"Marco A. Colón","stage":"enviame","focus":"Contemplar la santidad y gloria de Dios","idea":"Conocer a Dios despierta confianza para responder a su llamado.","biblia":"Isaías 6:3","scan_keys":["111","112","113a"],"full":true,"missing":"","wordRef":"Isaías 6:3 · fragmento citado en el capítulo","word":"¡Santo, santo, santo es el Señor de los Ejércitos Celestiales! ¡Toda la tierra está llena de su gloria!","life":"Craig recuerda el temor que puede despertar la oración «Envíame». Isaías respondió desde un encuentro con la presencia y la santidad de Dios. ¿Qué imagen limitada de Dios necesito revisar para acercarme con confianza y reverencia?","prayer":"Señor, abre mis ojos a tu grandeza. Enséñame a conocerte más allá de mis temores y suposiciones. Que al reconocer tu presencia pueda escucharte con atención y responder con confianza. Amén.","circle":"Dibuja un círculo y escribe en el centro «Gloria a Dios». En el borde anota tres atributos de Dios que aparecen en la lectura. Fuera del círculo escribe un temor que hace difícil decir «Aquí estoy». Une ese temor con uno de los atributos mediante una flecha y dedica unos minutos a orar sobre esa relación. Hoy da un paso de atención: lee Isaías 6:1–3 lentamente y escribe qué palabra te invita a confiar."},{"id":30,"date":"8 de diciembre","weekday":"Martes","title":"Gloria a Dios","ref":"3.3","part":"II","pages":"pp. 113–116 · desde «Para algunas personas»","reader":"Richard","stage":"enviame","focus":"Reconocer la presencia de Dios","idea":"Buscar a Dios con atención y responder desde la fe.","biblia":"Santiago 4:8","scan_keys":["113b","114","115","116"],"full":true,"missing":"","wordRef":"Santiago 4:8 · fragmento citado en el capítulo","word":"Acercaos a Dios, y él se acercará a vosotros.","life":"La lectura presenta los atributos de Dios y recuerda que su presencia puede reconocerse en la vida cotidiana, incluso cuando no sentimos algo extraordinario. ¿En qué momento de hoy puedo hacer una pausa para acercarme a Él y prestar atención?","prayer":"Dios santo y cercano, quiero conocerte con más profundidad. Ayúdame a buscarte con todo el corazón, a reconocer tu presencia en lo cotidiano y a confiar en ti aun cuando mis emociones no me den señales claras. Amén.","circle":"Dibuja un círculo con la palabra «Presencia» en el centro. En cuatro puntos alrededor escribe lugares o momentos de tu día: hogar, camino, trabajo y descanso. Elige uno y anota una acción pequeña para acercarte a Dios allí: leer un pasaje, orar, agradecer o guardar silencio. Al final del día registra en tu libreta qué observaste. La respuesta puede permanecer privada."},{"id":31,"date":"9 de diciembre","weekday":"Miércoles","title":"Un pecador salvado por la gracia","ref":"3.4","part":"I","pages":"pp. 117–120","reader":"Nanichi","stage":"enviame","focus":"Gracia que nos alcanza","idea":"Recibir misericordia y vivir desde ella.","biblia":"Isaías 6:5–7","scan_keys":["117","118","119","120"],"full":true,"missing":"","wordRef":"Isaías 6:5–7 · pasaje bíblico relacionado","word":"Isaías reconoce su necesidad de perdón; Dios quita su culpa y limpia su pecado.","life":"Al ver la santidad de Dios, Isaías reconoció su pecado y recibió gracia. ¿Qué actitud o hábito necesito reconocer con honestidad delante de Dios?","prayer":"Señor, ayúdame a mirarte con reverencia y a reconocer con sinceridad lo que necesito entregar. Gracias por tu gracia y tu perdón. Amén.","circle":"Dibuja un círculo y escribe en el centro «Gracia». En el borde anota una actitud que quieres reconocer ante Dios. Traza una flecha hacia el centro y dedica un momento a orar con honestidad. Luego escribe una forma concreta de vivir agradecida por su perdón."},{"id":32,"date":"10 de diciembre","weekday":"Jueves","title":"Un pecador salvado por la gracia","ref":"3.4","part":"II","pages":"pp. 121–123 · falta p. 124","reader":"Betsy Serrano","stage":"enviame","focus":"Gracia que nos alcanza","idea":"Recibir misericordia y vivir desde ella.","biblia":"Isaías 6:7–8","scan_keys":["121","122","123"],"full":false,"missing":"Páginas 121–123 transcritas a partir de las fotografías recibidas. Falta la página 124 para completar y verificar el cierre de esta parte.","wordRef":"Isaías 6:7–8 · pasaje bíblico relacionado","word":"Dios quita la culpa de Isaías; él responde: «Heme aquí, envíame a mí».","life":"La gracia de Dios transforma la culpa en gratitud y disponibilidad. ¿A quién puedo servir hoy como respuesta concreta al perdón que he recibido?","prayer":"Señor, gracias por tu gracia. Ayúdame a responder con un corazón dispuesto y a mostrar tu amor a alguien que lo necesita. Amén.","circle":"Dibuja un círculo y escribe en el centro «Aquí estoy». Dentro, anota una gracia que has recibido. Fuera, escribe el nombre de una persona a quien puedas animar o ayudar hoy. Une ambos con una flecha y da ese paso."},{"id":33,"date":"11 de diciembre","weekday":"Viernes","title":"Alimento diario","ref":"3.5","part":"I","pages":"pp. 125–130 · corte interno pendiente","reader":"Ashley","stage":"enviame","focus":"Lo cotidiano también alimenta","idea":"Una relación con Dios día a día.","biblia":"Por seleccionar","scan_keys":[],"full":false,"missing":"Todavía no se han recibido las páginas de esta lectura."},{"id":34,"date":"12 de diciembre","weekday":"Sábado","title":"Alimento diario","ref":"3.5","part":"II","pages":"pp. 125–130 · corte interno pendiente","reader":"Mariluz","stage":"enviame","focus":"Lo cotidiano también alimenta","idea":"Una relación con Dios día a día.","biblia":"Por seleccionar","scan_keys":[],"full":false,"missing":"Todavía no se han recibido las páginas de esta lectura."},{"id":35,"date":"13 de diciembre","weekday":"Domingo","title":"Un acto único de fe","ref":"3.6","part":"","pages":"pp. 131–134","reader":"Yasmary","stage":"enviame","focus":"Un paso de fe","idea":"La obediencia comienza con una decisión.","biblia":"Por seleccionar","scan_keys":[],"full":false,"missing":"Todavía no se han recibido las páginas de esta lectura."},{"id":36,"date":"14 de r">Portal de preparación · Hermanos Circuleños · Fuente base: Craig Groeschel, Oraciones peligrosas, Origen. · Maqueta local no publicada.</div>`;const f=document.getElementById('search');f.value=searchTerm;f.addEventListener('input',e=>{searchTerm=e.target.value;showCards()});showCards()}

const TRANSCRIPTIONS={"21":"Uno de mis primeros descubrimientos acerca de la oración sucedió años atrás cuando operaron a mi madre. Mi familia y yo nos habíamos reunido en el cuarto de hospital de mamá, intentando asegurarle que la cirugía de la mañana siguiente se desarrollaría sin contratiempos. Ella se encontraba lógicamente nerviosa, así que cuando un hombre de mediana edad con traje negro y alzacuellos llamó a la puerta y preguntó si le gustaría que ore por ella, mamá exclamó: «¡Pues claro que quiero que ore por mí!».\n\nÉl sonrió y asintió, manteniendo una actitud confiada mientras sacaba del bolsillo de su traje un pequeño y desgastado libro de cuero. De pie junto a su cama, preguntó: «¿Cuál es su preferencia denominacional?».\n\n«Soy solo una... bueno... soy solo una cristiana regular. No tengo una preferencia denominacional. Solo protestante».\n\nYo sabía que ella había crecido asistiendo a una escuela luterana, pero también que nuestra familia había asistido a una iglesia metodista desde que tengo memoria. En realidad, nunca pareció ser un asunto importante. Sin embargo, por lo visto el capellán no compartía nuestra actitud casual con respecto a las denominaciones.","22":"«Es que... lo siento, señora», dijo, meciéndose de un lado a otro. «Es solamente que me facilitaría saber qué oración debo leer, si usted pudiera escoger una denominación con la que se sienta cómoda».\n\n«Bueno, intentemos entonces con la metodista». Mamá sonrió cortésmente, ansiosa por ayudar al capellán a hacer su trabajo.\n\nAliviado, él le devolvió la sonrisa y hojeó su librito hasta que encontró la página que buscaba. Entonces comenzó a leer la oración, y honestamente, la única razón por la que supimos que se trataba de una oración era porque él nos lo había dicho. Con su voz alegre y monótona, el capellán podría haber estado recitando una rima infantil o su lista de compras.\n\nAntes de que pudiera terminar, mamá lo interrumpió. Tendrías que conocer a mi madre para comprender plenamente el impacto de su interrupción. Ella es la persona más amable, considerada y cariñosa que te puedas imaginar. Te daría su último dólar, atravesaría la ciudad a pie para ayudarte y te escribiría una carta de tres páginas para agradecerte por el regalo que le enviaste. Es absolutamente amable como pocas, pero también es conocida por ser un poco irritable. No solo le encanta divertirse, rara vez se anda con rodeos. Si lo piensa, lo dice. Sin reprimirse.\n\nMientras el capellán continuaba leyendo su prescrita oración metodista, mi madre lo interrumpió. Lo suficientemente alto como para que la escucharan hasta la estación de enfermeros, en son de broma protestó: «¿Alguien puede conseguirme por favor un capellán que sepa hacer sus propias oraciones?».\n\nAl principio, todos tratamos de no reírnos, pero fue imposible contenernos. Hasta el capellán, ¡pobre hombre!, tuvo que sonreír. Todos en mi familia todavía se ríen cuando volvemos a contar esta historia sobre la franqueza con la que mamá evaluó la manera de orar de este hombre. Pero el argumento de mamá es válido.\n\nOrar de corazón es personal e inconfundible.","23":"Ciertamente no hay nada malo en leer una oración o utilizar las palabras de otra persona para orar. De hecho, leer las oraciones puede ser un buen punto de partida para aprender a orar por tu cuenta. Sin embargo, con el paso del tiempo, si quieres conocer a Dios de una manera más íntima, empezarás a orar más espontáneamente con oraciones que salen directamente de tu corazón. A medida que tu fe crezca, lo más probable es que tus oraciones broten de tu interior. Tal vez ni siquiera sepas cómo expresarlas con palabras. Son simplemente comunicación entre tú y el Padre, el Dios Todopoderoso viviente. Palabras profundamente personales y tan únicas como tu huella digital.\n\nNo tienes que ir muy lejos en los Salmos para encontrar el clamor honesto del corazón de David. Él cuestionó a Dios. Él reclamó a Dios. Él suplicó a Dios. Desde el fondo de su alma, David clamó a su Padre celestial, preguntando: «¿Hasta cuándo, Jehová? ¿Me olvidarás para siempre? ¿Hasta cuándo esconderás tu rostro de mí? ¿Hasta cuándo pondré consejos en mi alma, con tristezas en mi corazón cada día? ¿Hasta cuándo será enaltecido mi enemigo sobre mí?» (Salmo 13:1-2).\n\nPero me temo que muchos de nosotros no nos sentimos cómodos orando abierta y libremente. Asumimos que hay una manera correcta, mejor o más elocuente. Tendemos a caer en las rutinas y a orar por las mismas cosas una y otra vez. Nos aburrimos de nuestras oraciones.\n\nY si nos aburrimos de nuestras oraciones, entonces me pregunto si realmente estamos orando.","25":"La oración es comunicación sagrada, el lenguaje del anhelo, un diálogo divino entre tú y el Padre celestial, tu Abba, tu Papá. Cuando oras, el Dios del universo escucha. Y no solo escucha, sino que también se preocupa sobre lo que tienes que decir, sobre todas las cosas que llevas en tu corazón y que nadie más conoce. Quizás incluso algunas cosas que no conoces. Dios quiere escucharte y hablarte. Quiere comunicarse contigo de la misma manera que te sientas frente a un ser querido y disfrutas de una conversación íntima.\n\nTus oraciones importan.\n\nCómo oras importa.\n\nLo que oras importa.\n\nTus oraciones conmueven a Dios.\n\nSe nos dice en la Biblia que nos «acerquemos con toda confianza al trono de la gracia de nuestro Dios» (Hebreos 4:16a NTV). No tenemos que acercarnos tímidamente o sentirnos incómodos —podemos presentarnos ante Él con confianza, seguridad y valentía. Cuando oremos de esta manera, entonces «recibiremos su misericordia y encontraremos la gracia que nos ayudará cuando más la necesitemos» (Hebreos 4:16b NTV).","26":"¿Necesitas gracia en tus relaciones con otras personas?\n\n¿Necesitas misericordia por todas las cosas secretas con las que luchas?\n\n¿Necesitas ayuda para sobrevivir el día?\n\nYo sí. Enormemente. Todos los días. Y en todos los sentidos.\n\nAsí que permítanme compartir algo que me ha ayudado a desarrollar músculo espiritual, en lugar de esas oraciones débiles que mi amigo señaló. Se trata simplemente de tres oraciones extraídas de la Biblia que puedes hacer y convertirlas en tuyas. Con esto simplemente quiero decir que puedes hacerlas con tus propias palabras, permitiendo que se eleven al cielo incluso mientras penetran tus huesos. Son herramientas para enfocar tus oraciones y comunicación con Dios.\n\nPero debo advertirte: no son oraciones seguras. No son benignas, corteses o a medias. No puedes simplemente memorizarlas con la esperanza de un momento cálido y tierno con Dios.\n\nEstas oraciones requieren fe, valor. Te piden que te arriesgues.\n\nEs casi seguro que te sacarán de tu zona de confort. Para expandirte. Para ayudarte a sentir verdaderamente incómodo. Requerirán que mires profundamente dentro de ti mismo; que dejes de fingir sobre determinados aspectos de tu vida; que seas honesto contigo mismo ante Aquel que te conoce mejor que tú mismo.\n\nPuede ser que estas oraciones derritan tu corazón y abran una conciencia del pecado en tu vida. Puede que te sientas impulsado a dar un paso audaz de fe radical, confiando en Dios a medida que lo sigues y te sales del guion del patrón predecible de tu vida. Es probable que te sientas desafiado a dejar atrás la seguridad, la comodidad y la conveniencia espirituales.\n\nEn lugar de una oración segura que sea solo sobre ti, podrías orar primero por los demás, sufriendo por ellos, esperando por ellos, pidiendo a Dios en nombre de ellos.","27":"En lugar de limitarte a pedir protección y seguridad, podrías preguntar qué es lo que quiere Dios que hagas y adónde quiere que vayas.\n\nEn lugar de pedirle siempre más, podrías alabarlo por todas las bendiciones que ya ha derramado en tu vida. Luego de reconocer todas estas bendiciones, entonces podrías pedirle que bendiga a alguien más.\n\nEn lugar de simplemente marcar una casilla, tus oraciones podrían cambiar la eternidad, sacudir el infierno, asustar a los demonios y agrandar el cielo. ¿Suena extremo? Te prometo que no lo es. Más importante aún, Dios lo promete. Si lo llamas, Dios te asegura que escucha los clamores de tu corazón.\n\nTus oraciones se vuelven peligrosas.\n\nPero no se suponía que fuera seguro seguir a Jesús.\n\nÉl prometió a sus seguidores que enfrentarían problemas (ver Juan 16:33). Jesús advirtió a aquellos que le servían fielmente que serían perseguidos al igual que él (ver Juan 15:20). Jesús nos alerta de los desafíos venideros. Debido a que lo amamos, enfrentaremos pruebas y oposición. Pero incluso en medio de pruebas dolorosas, Jesús nos invita a responder con gracia y a hacer lo que se siente como una oración vulnerable y peligrosa. Jesús dijo: «Pero yo os digo, amad a vuestros enemigos y orad por los que os persiguen» (Mateo 5:44). Ama a los que quieren hacerte daño. Y ora por aquellos que están resueltos a destruirte.\n\n¿Te atreves a orar de una manera en la que jamás habías orado?\n\n¿Con todo tu corazón, alma, mente y toda la extensión de tu ser?\n\n¿Qué pasaría en tu vida y en la vida de aquellos a tu alrededor si comenzaras a hacer oraciones peligrosas?\n\n¿Te atreves a averiguarlo?","29":"La primera oración viene de David, y es una maravilla. En el Antiguo Testamento vemos a David enfrentarse a los enemigos de Dios a diestra y siniestra. En un arrebato de celos, el rey Saúl acusó falsamente a David de traición y de intentar asesinar al rey. Saúl envió todas sus fuerzas tras David en repetidos intentos de quitarle la vida y eliminar lo que Saúl veía como su mayor amenaza. Y sabía cómo golpear donde más duele: afirmó que David no era fiel a su Dios.\n\nCon todo su corazón, David quería agradar a Dios. Luchó contra su ira para proteger y honrar al rey. Sin embargo, sabiendo que sus motivos no siempre eran perfectos, David entregó su corazón ante Dios e hizo una de las oraciones más vulnerables, transparentes y peligrosas que jamás hayas escuchado. Queriendo honrar a Dios en todos los aspectos de su ser, David oró: «Examíname, oh, Dios, y conoce mi corazón; pruébame y conoce mis pensamientos, y ve si hay en mí camino de perversidad, y guíame en el camino eterno» (Salmo 139:23-24).\n\nEsta oración no solo es difícil de hacer, sino que es aún más difícil de aplicar y vivirla. Porque si tienes el valor de hacerla, entonces","30":"tendrás que ejercitar el valor para vivir lo que Dios te responda, que no la hagas si no la vas a hacer con convicción.\n\nTen cuidado. Esta oración tiene el potencial de doblegarte, de corregirte, de redirigir tu vida, de cambiar la forma en que te ves a ti mismo, de cambiar la forma en que ven los demás.\n\nTal vez sigas pensando que esto no es gran cosa. Tal vez estés preguntando por qué deberías pedirle a Dios que examine tu corazón cuando él ya sabe todo lo que hay dentro de ti. Sabe lo que hay ahí dentro. Él sabe lo que hay ahí dentro. Entonces, ¿por qué preguntar algo tan obvio?\n\nAquí es donde resulta complicado. En la superficie, parece que debiéramos conocer nuestros propios corazones. ¿Correcto? Conozco mis motivos. Sé lo que es más importante. Sé por qué hago lo que hago. Además, podrías decirte a ti mismo, tengo buen corazón. No trato de lastimar a la gente. Quiero hacer lo correcto. Mi corazón es bueno. Estoy orando, ¿no?\n\nPero la Palabra de Dios en realidad revela exactamente lo contrario. Puede ser chocante cuando lo escuches por primera vez, pero Jeremías nos dice una verdad clara. Jeremías era hijo de un sacerdote levítico nacido alrededor del año 650 A. C. Durante el reinado del rey Josías, Dios preparó a este joven profeta para llevar la Palabra de Dios a Israel y a las naciones. Jeremías dice rotundamente que tú, como yo y todos los demás, no tienes buen corazón. De hecho, no solo tu corazón no es bueno, sino que tu corazón es inicuo y pecaminoso en todos sus aspectos. El profeta dijo: «El corazón humano es lo más engañoso que hay, y extremadamente perverso. ¿Quién realmente sabe qué tan malo es?» (Jeremías 17:9 NTV).\n\nEs fácil fingir que somos buenos de corazón, pero la Biblia nos enseña que nuestro corazón nos engaña y es desesperadamente malvado. En esencia, nuestro corazón tiene que ver con nosotros mismos, no con Cristo. Tiene que ver con lo que es temporal, no","32":"Te dices a ti mismo: «no soy materialista; simplemente me gustan las cosas bonitas. No soy un chismoso; solo se los cuento para que puedan orar. No tengo un problema; esto es solo una cosa que hago para salir adelante».\n\nApuesto a que David tuvo la tentación de arreglárselas cuando estaba huyendo de Saúl para salvar su vida. Podría haber usado alcohol para escapar. Podría haberse enojado, resentido y amargado. O David podría haber conspirado para lastimar al Rey Saúl, justificando sus acciones en nombre de la supervivencia. Pero en lugar de tomar el camino fácil, David eligió uno más atrevido. El «varón conforme a su corazón [de Dios]» (1 Samuel 13:14) decidió orar, sabiendo que su propio corazón era capaz de engañarlo una y otra vez.\n\nSin Cristo, tu corazón es deshonesto.\n\nPor eso esta oración de David es tremendamente peligrosa.\n\n«Examina mi corazón, Señor».","33":"Estaba en la escuela secundaria la primera vez que me encontré con la oración peligrosa de David. Los miércoles por la noche en nuestra iglesia metodista, mis amigos y yo íbamos a nuestra reunión semanal del grupo de jóvenes. Si bien no estoy seguro de cuánto crecí espiritualmente en estas reuniones, algunas cosas se destacan. Lo primero tendrían que ser nuestras épicas batallas del juego de cuatro cuadras. No creo que se mencionen juegos de cuatro cuadras en la Biblia, pero uno pensaría que se trataba del Armagedón considerando la forma en que lo jugábamos.\n\nTambién recuerdo los refrigerios en nuestra pequeña cafetería. Cada semana, algunas de las señoras mayores nos horneaban golosinas: brownies, galletas, barras de limón. Algunas semanas iba solo para ver cuál sería el festín. Estas mujeres metodistas se tomaban en serio demostrar la veracidad de la Biblia cuando dice: «Gustad, y ved que es bueno Jehová» (Salmo 34:8).\n\nTambién recuerdo que los pastores de jóvenes no duraban mucho. La mayoría parecían temporales, como si solo estuvieran de visita para ver si podíamos ser una iglesia en la que quisieran establecerse. Tenía que ser difícil tratar de conectar con un grupo","34":"de adolescentes malhumorados, todos tratando de impresionarse unos a otros más que deseando aprender acerca de Dios. A pesar de la rotación de pastores, hubo un muchacho que tuvo un gran impacto en mí.\n\nDebo haber estado en el tercer año de secundaria cuando varios de nosotros abordamos un pequeño autobús para viajar al campamento metodista, ubicado a unas dos horas de nuestra iglesia. El primer día en el campamento, después de un momento de adoración, el pastor del ministerio juvenil enseñó una lección sobre la oración introspectiva de David pidiéndole a Dios que «lo examine». Al final de su lección, nos animó a que cada uno por su cuenta hiciera esa oración una y otra vez, escuchando lo que Dios podría decirnos en respuesta. Yo estaba atento, pero no tenía idea de lo que Dios estaba a punto de poner en marcha en mi vida.\n\nDejé a la multitud y caminé hasta el borde del patio de recreo donde los árboles no habían sido talados. El aire olía a fresco, como el pino, mientras las nubes blancas se deshacían arriba en el cielo azul. Sentado cerca del borde de la línea de árboles, me tomé la tarea en serio. Es hora de que aprenda a orar, a orar de verdad. No podía ver a nadie más alrededor, así que lo dije en voz alta: «Dios, examina mi corazón».\n\nOjalá pudiera decirte que Dios me mostró que mi corazón era puro, que mis comportamientos eran santos y que mis motivos estaban dirigidos a servirle. Pero ese día, recuerdo claramente haber sentido una respuesta a mi petición. Dios no habló de manera audible, y no vi una señal en el cielo. No hubo separación de nubes ni rayos. Tan solo sentí una presencia muy personal y santa. Y en el mismo momento en que sentí un inconfundible amor celestial, también simultáneamente me di cuenta de la magnitud de mi pecaminosidad.\n\nEra tan hipócrita.","35":"Mis compañeros me habían elegido para ser presidente de nuestro grupo de jóvenes, líder y modelo a seguir para todos los otros chicos de nuestra iglesia. Pero mi vida era una farsa en lo que respecta a mi fe. Actuaba serio y sincero los miércoles por la noche en el grupo de jóvenes y luego festejaba con un grupo más libertino el fin de semana. Fingía que conocía a Dios, pero mi vida y mi corazón revelaban cuán lejos de Él estaba realmente. Aparentaba para uno de los grupos e interpretaba un rol completamente diferente para una audiencia más cómoda.\n\nAsí que cuando hice una pausa para orar «examíname» esa tarde en el campamento de la iglesia, me sorprendió la realidad de las profundidades de mi pecado. Años después descubrí un versículo que lo dice bien: «Este pueblo se acerca a mí con su boca, y con sus labios me honra, pero su corazón está lejos de mí» (Isaías 29:13). Hablaba a Dios de labios para afuera, pero mi corazón era perverso. Predicaba, pero no vivía lo predicado. Fingía ser cristiano, pero no conocía al Cristo.\n\nFue entonces cuando me di cuenta de que cuanto más me acercara a Jesús, más tendría que enfrentar mis faltas. Mi orgullo. Mi egoísmo. Mi lujuria. Mi espíritu crítico.\n\nHacer esta oración peligrosa ese día abrió un canal de comunicación con Dios que no sabía que existía. En lugar de pedirle simplemente a Dios que hiciera algo por mí, le pedí que revelara algo en mí. Y me reveló cosas ese día que iniciaron mi camino hacia conocer a Dios personalmente. Me quedó claro que era un desastre. Mentía. Engañaba. Robaba. Hacía lo que quería sin importar a quién lastimara. Lo que había parecido normal ahora se sentía errado. La vida que pensé que quería me llevó a convertirme en alguien que odiaba. Desafortunadamente, este momento de verdad con Dios no me cambió instantáneamente, pero","36":"me ayudó a reconocer mi necesidad espiritual. Sabía que algo tendría que ser diferente. Y con el tiempo aprendería que ese algo era aprender a amar y servir con cada fibra de mi ser a alguien llamado Jesús.\n\nEs una oración peligrosa.\n\nPero es una que podría redirigir tu vida.\n\n«Examíname, Señor».","37":"¿Qué es lo que te pone ansioso? ¿Nervioso? ¿Inestable? ¿Temeroso?\n\nNo estoy hablando de miedos externos normales como serpientes, arañas o el miedo a volar. Me pregunto qué te mantiene despierto por la noche, esas cosas que dan vueltas en tu mente y se niegan a ser calladas. Cosas como perder tu trabajo. No estar casado. O estar atrapado en un mal matrimonio. Que tu salud falle. Vaciar tu cuenta de ahorros solo para sobrevivir.\n\nNo sabemos qué temores exactos estaban pasando por la mente de David, pero está claro que estaba preocupado por su seguridad y quizás su futuro. Porque después de pedirle a Dios que examinara su corazón, David oró: «conoce mis pensamientos ansiosos» (Salmo 139:23). Quería compartir sus peores temores con Dios para enfrentarlos y darles un nombre. Quería confiar en que Dios era más grande que cualquier temor que David pudiera imaginar.\n\n¿Estás dispuesto a hacer tal oración? «Señor, revela lo que retiene mi mente como rehén. Muéstrame lo que más temo. Adelante, ayúdame a enfrentar lo que me aterroriza».","38":"Quizás te preguntes por qué nuestros «pensamientos ansiosos» son importantes para Dios. No se trata necesariamente de nuestra comodidad y de vivir una vida libre de estrés. Pero la respuesta a esta pregunta es quizás mucho más importante de lo que la mayoría de nosotros entenderíamos en la superficie.\n\nLo que tememos importa.\n\nHace años, tuve una revelación sobre este tema que me tocó de una manera muy personal. Dios me mostró que aquello a lo que más temía revelaba dónde confiaba menos en Dios. Después del nacimiento de nuestra tercera hija, Anna, Amy comenzó a tener problemas físicos. Al principio, pensamos que era solo fatiga, pero cuando la mitad de su cuerpo se entumeció, temimos que fuera algo mucho peor. Médico tras médico no pudieron darnos respuestas. A medida que sus síntomas continuaron empeorando, mi confianza en Dios comenzó a debilitarse.\n\nEste miedo llevó a otros y por la noche mis pensamientos se descontrolaban. ¿Y si Amy está gravemente enferma? ¿Y si la pierdo? No podría criar a nuestros hijos sin ella. No podría seguir dirigiendo la iglesia. No podría salir adelante. Entonces me di cuenta. Las cosas que me mantenían despierto por la noche eran las cosas que no confiaba en que Dios se encargaría. Me estaba aferrando a ellas, rumiando sobre ellas, tratando de encontrar una manera de controlarlas, de resolver todos mis problemas, de planificar cada contingencia. Afortunadamente, por la gracia de Dios, Amy fue mejorando gradualmente hasta recuperar toda su fuerza, pero los desafíos expusieron una de mis peores debilidades. El miedo me había consumido.\n\n¿Qué pasa contigo? ¿Cuáles son las áreas a las que te estás aferrando incluso mientras permites que te aterroricen? ¿Qué temores le estás ocultando a Dios?","39":"Piénsalo. Si sientes miedo por el futuro de tu matrimonio, esto es una señal de que no confías plenamente en Dios respecto de tu matrimonio. Si te abruma la preocupación de cómo pagarás tus facturas, esto posiblemente revela que no estás confiando en que Dios sea tu proveedor. Si te paraliza la preocupación con respecto a la seguridad de tus hijos, ¿podría ser que no estás confiando en que Dios los mantendrá a salvo?\n\nPor mi experiencia al hacer esta oración, Dios a menudo ha revelado mis pensamientos ansiosos y los miedos que los alimentan. Uno de los primeros temores que reveló también ha demostrado ser uno de los más persistentes. Me aterroriza fallar. Comenzó cuando era un niño jugando béisbol y me sentía muy asustado de jugar mal delante de mi padre, que alguna vez fue jugador profesional. Como adulto, tengo miedo de equivocarme en mi próximo sermón, en mi próximo proyecto o en mi responsabilidad de ser un buen padre. Tengo mucho miedo de decepcionar a la gente, de no ser suficiente, de no hacer lo que hay que hacer. Siempre me siento inadecuado.\n\nDe hecho, mientras escribo las palabras en esta página, me preocupa la salud de mi hija. Mandy tiene veintitrés años, está casada y es tan talentosa como cualquiera que yo conozca. Sin embargo, durante casi tres años, no ha podido funcionar como una persona normal. Hemos hecho más oraciones de las que podríamos contar. Hemos visto médicos en todo el país. Hemos probado las dietas más específicas que puedas imaginar. Hemos probado alternativas naturales e incluso algunas cosas que harían que algunas personas piensen que estamos locos. No solo soy cristiano, soy pastor. Sé que no debería preocuparme. Pero cuando se trata de tus propios hijos, es difícil no dejar que tu mente corra en la dirección equivocada.\n\nEsto me lleva de vuelta a por qué quería escribir este libro. Con todo mi corazón, conozco el poder de hacer oraciones peligrosas.","40":"Y estoy continuamente harto de mis oraciones seguras. No puedo soportar otro día de mi cristianismo egocéntrico. Así que este mensaje arde dentro de mí. Pero me preocupa no poder llevar la idea de mi corazón a la página. ¿Qué pasa si mi escritura no es lo suficientemente poderosa? ¿No te convence? ¿No te doblega? ¿No mueve tu corazón?\n\nNuestros miedos importan. Porque, en última instancia, nuestros miedos muestran cómo confiamos en nuestros propios esfuerzos y no confiamos en nuestro Salvador. La verdad es que nosotros, tú, yo y todos, siempre somos inadecuados. Nunca somos suficientes. Siempre somos débiles. Pero aquí está lo increíble: cuando somos débiles, el poder de Dios se perfecciona (ver 2 Corintios 12:9).\n\nTu mayor temor puede indicarte tu mejor oportunidad de hacer una diferencia en el mundo. Necesitas a Dios para cada momento de cada día. Todo lo que haces de valor nace de su corazón, su poder, su gracia.\n\nPara agradar a Dios, servirle, honrarle, vivir para él, no puedes dejarte llevar por el miedo. Debes ser guiado por la fe. A menudo he dicho que el camino hacia tu mayor potencial suele ser directo a través de tu mayor miedo. La fe te impulsará hacia adelante. De hecho, lo que Dios quiere para ti puede estar del otro lado de lo que más temes. El apóstol Pablo animó a su protegido Timoteo a aferrarse a la fe recordándole: «Dios no nos ha dado un espíritu de temor y timidez, sino de poder, amor y autodisciplina» (2 Timoteo 1:7 NTV).\n\nA lo largo de los siglos, muchos cristianos han creído que el enemigo de Dios, el diablo, intenta influir en los creyentes con","41":"mentiras. Si tienes miedo de fallar, es posible que tu enemigo espiritual esté tratando de disuadirte de que hagas aquello para lo que Dios te ha creado. Así que ora y entra en tu miedo. Deja que Dios te impulse hacia adelante por fe. Sin fe, es imposible agradar a Dios. Recuerda que amas agradar a Dios más de lo que temes fallar.\n\nMientras haces esta oración peligrosa y Él revela lo que te impide seguirlo completamente, no te pierdas la oportunidad de experimentar su amor. Sumérgete en su extravagante gracia. Disfruta de la bondad incondicional de Dios derramada por ti en la vida de Cristo. Recuerda: «el perfecto amor echa fuera el temor» (1 Juan 4:18).\n\nA medida que Dios revela tus temores, también fortalece tu fe. Lo necesitas. Necesitas su presencia. Necesitas su poder. Necesitas que su Espíritu te guíe. Necesitas que su Palabra te fortalezca. La fe no significa que no sientas miedo. La fe significa que no dejas que el miedo te detenga.\n\nLo que más temes te muestra donde necesitas crecer con Dios.\n\n¿A qué le temes? ¿Cuáles son tus pensamientos ansiosos?\n\n¿Qué te está mostrando Dios?\n\n¿Dónde necesitas crecer en la fe?\n\nConfía en Él.","43":"Si la oración de David no ha parecido ya lo suficientemente peligrosa, entonces me gustaría advertirle amablemente: está a punto de volverse aún más intensa.\n\nDavid fue llamado «un varón conforme al corazón de Dios» (ver 1 Samuel 13:14 y Hechos 13:22). Se dedicó a la voluntad de Dios y adoró con pasión; dio de manera extravagante y dirigió con valentía. Sin embargo, igualmente cometió errores —y de los grandes. Como tú y como yo, estuvo tentado a pecar y no siempre tomó la decisión correcta. Incluso después de conocer la bondad de Dios y caminar con Él durante la mayor parte de su vida, David todavía llegó a cometer errores. Y por eso dijo esta parte peligrosa de la oración: «Examíname, oh, Dios... conoce mis pensamientos ansiosos... ve si hay en mí camino de perversidad» (Salmo 139:23-24).\n\nMuéstrame si estoy haciendo algo que ofenda o lastime tu corazón.\n\nEscuchar la respuesta de Dios a esta parte de la oración puede ser un desafío. No es fácil porque la mayoría de nosotros somos expertos en justificar nuestras acciones incorrectas. Si eres como yo,","44":"eres bueno acusando a los demás e igualmente bueno excusándote. Puedo señalar tus fallas, pero tengo una explicación perfectamente buena de por qué hago algo que tú puedes considerar inapropiado. Soy bueno para hacer lo que Jesús advirtió en Mateo 7. Puedo señalar la mota de aserrín en tu ojo mientras ignoro la viga en el mío.\n\n¿Cómo escuchas de Dios acerca de lo ofensivo que pueda haber en ti? Permíteme sugerirte tres cosas a considerar mientras examinas el corazón de Dios con esta peligrosa oración.\n\nPrimero, considera lo que otros te han dicho sobre ti. ¿Hay un área de tu vida, tus hábitos, tus relaciones o tus acciones que otros han sugerido cambiar? ¿Hay algún área de tu vida que sea cuestionada por otros? ¿Tus seres queridos han expresado su preocupación por ti o te han pedido que consideres buscar ayuda?\n\nCuando estaba en el seminario y tomé una clase de consejería, mi profesora nos enseñó un principio que nunca olvidaré. Ella señaló que si más de dos personas a las que amas y en las que confías te sugieren que tienes un problema, de
