bes reconocer que tienes un problema y abordarlo de inmediato.\n\nSu sabiduría se quedó conmigo a través de los años. Cuando le pidas a Dios que te muestre si tienes comportamientos ofensivos, comienza con lo que otros te han mencionado. ¿Hay algo en tu vida que tus seres queridos consideren que no es saludable o prudente?\n\nTal vez algunas personas te han dicho que juegas demasiado a los videojuegos. Les preocupa que tienes más para ofrecer, que te estás perdiendo cosas más importantes en la vida.\n\nQuizás alguien ha indicado que bebes demasiado. O que tienes un problema con los analgésicos. O que comes en exceso. Si más de dos amigos o familiares de confianza han indicado esto, tal vez sea el momento de hacer una pausa y prestar atención.","45":"Tal vez has tenido una mala racha en las citas. Tus amigos continúan recordándote que siempre dices que sí al tipo de persona equivocado. En lugar de defender tus acciones, quizás sea el momento de considerar cambiar tus patrones.\n\nEn los últimos años, tuve que hacer una pausa y reconocer algo que estaba fuera de control en mi vida. Varias personas indicaron que yo era un esclavo de mi teléfono móvil. Mi esposa, Amy, fue la más vehemente y franca. Los suspiros de mis hijos y sus muecas decían mucho también.\n\nAntes de que tomara en serio su observación amorosa, mis defensas entraron en acción. El argumentador experto emergió. Lo que estoy haciendo es importante. Para ser un buen pastor tengo que estar disponible para la gente. Dirijo una iglesia y mi opinión es importante. Mi presencia en las redes sociales puede ser un buen testimonio. Realmente necesito ver cómo se está desempeñando mi última publicación de Instagram y revisar si hay algún comentario que requiera mi atención.\n\nPensarías que escuchar de Amy y mis hijos sería suficiente. Pero cuando algunas personas de la oficina lo mencionaron, el consejo de mi antigua profesora de seminario comenzó a resonar en mi cerebro. Así que decidí orar: «Muéstramelo, Dios. Ve si hay un comportamiento ofensivo en mí. ¿Es esto un problema?»\n\nEstaba en el partido de fútbol de mi hijo cuando Dios respondió a mi oración. Estaba respondiendo a un mensaje de texto y me perdí el increíble tiro de esquina de mi hijo que su compañero de equipo dirigió hacia la portería para tomar una ventaja de 1-0 contra el equipo mejor clasificado. Luego, al final de la segunda mitad, con el partido empatado 1-1 y faltando unos minutos para el final, me perdí de ver el gol ganador de mi hijo porque estaba revisando una publicación en las redes sociales.\n\nDios me lo mostró claramente: me estaba conformando con una realidad falsa y me estaba perdiendo lo que más importaba. Me","46":"estaba perdiendo mi vida, perdiendo momentos preciosos con las personas que más amo.\n\n¿Qué hay de ti? ¿Hay algo que otros han estado tratando de ayudarte a ver sobre ti mismo que debe cambiar? Proverbios 12:15 dice: «El camino del necio es derecho en su opinión; mas el que obedece al consejo es sabio». Tal vez sea hora de hacer una pausa y escuchar. Dios puede hablarte a través de quienes más te aman.\n\nAdemás de considerar lo que otros te han dicho, también considera aquellas cosas que has justificado. ¿Hay algo en tu vida que está mal, pero sigues ignorando las señales de advertencia de la gracia de Dios?\n\nSi soy honesto, mi capacidad de justificar el pecado da miedo. Aunque ahora es algo divertido, hay una historia que no podría ilustrar mejor esta idea. Hace años en la iglesia, criticaba en broma a las personas que conducían por el arcén durante los grandes atascos de tráfico. Lo más probable es que hayas visto esto. El tráfico está detenido en la carretera a lo largo de varias millas cuando, inevitablemente, un conductor se detiene en el arcén del lado derecho de la carretera y pasa por delante de todos los demás que están siguiendo las reglas. Durante el sermón de ese domingo, bromeé acerca de que esas personas respondían a Dios antes de que él las enviara directamente al infierno.\n\nAl día siguiente, un lunes temprano por la mañana, conducía hacia la oficina de la iglesia. Por alguna razón, había más tráfico de lo habitual aproximadamente a lo largo de media milla frente a nuestra iglesia. Esperé pacientemente, preguntándome por qué no nos estábamos moviendo. Después de varios minutos sin ningún movimiento, miré hacia el lado derecho. Nuestra iglesia era dueña de todo el terreno entre el lugar donde estaba atrapado y la entrada a la iglesia. El terreno aún estaba sin urbanizar y el césped era fácil","47":"de transitar. Argumenté que el terreno pertenecía a la iglesia, y que, por lo tanto, tenía derecho a conducir por él. Y así lo hice, pasando a otros conductores al costado de la carretera.\n\nPoco sabía yo que iba a pasar por delante de uno de los miembros de nuestra iglesia llamado Mark Dawson. A su lado estaba su hijo pequeño, Alex, quien gritó: «¡Papá, ahí va uno de esos conductores que el pastor Craig odia!». Apenas había terminado de decir esa primera frase cuando gritó en estado de shock y consternación: «¡Papá! ¡Ese hombre es el pastor Craig!». Menos de veinticuatro horas después de haber despotricado acerca de lo incorrecto que es conducir en el arcén, hice exactamente lo mismo. Señor, muéstrame si hay algún comportamiento ofensivo en mí.\n\nConsidera lo que has justificado. ¿Hay un área de tu vida sobre la cual otros hayan expresado preocupación? ¿Y te has defendido? Piensas: no es la gran cosa. Yo puedo con esto. Así es como me las arreglo. Además, no estoy lastimando a nadie. Es mi vida. ¿Quién eres tú para juzgarme? No tengo ningún problema. Estoy bien. Tú sigue con tus asuntos y déjame a mí con los míos.\n\nEsta es otra razón por la cual esta oración peligrosa no solo es importante sino imperativa. Necesitamos la ayuda de Dios para ver el pecado que es difícil de ver en el espejo. Si no tenemos cuidado, podemos terminar como las personas que David describió en el Salmo 36. Él declaró poderosamente: «Se lisonjea, por tanto, en sus propios ojos, de que su iniquidad no será hallada y aborrecida. Las palabras de su boca son iniquidad y fraude; ha dejado de ser cuerdo y de hacer el bien» (Salmo 36:2-3).\n\n¿Con qué frecuencia nos adulamos? No soy como ellos. Estoy bien espiritualmente. No tengo ningún problema. Sin siquiera saberlo, nuestros corazones embusteros nos engañan para que ignoremos nuestro propio pecado. Y las justificaciones continúan.","48":"• No hay nada de malo en mirar pornografía. Todos lo hacen. Además, podría estar haciendo algo mucho peor. No estoy lastimando a nadie.\n\n• No tengo un problema de temperamento. No te gritaría si no hicieras lo que haces. No es mi culpa que me hagas enojar tanto.\n\n• Mi forma de beber no es un problema. Solo tomo unas cervezas para que me ayuden a relajarme. No es como si estuviera bebiendo whisky o algo así.\n\n• No estoy contando chismes. No puedo evitar que la gente me confíe cosas. Solo estoy transmitiendo información que probablemente sea cierta. Además, ayuda a otros a saber cómo orar.\n\n• El juego no es un problema para mí. Es solo entretenimiento. Puedo dejar de hacerlo cuando yo quiera.\n\n• No soy egoísta. Simplemente me gustan las cosas bonitas. Deseo lo que me corresponde. He trabajado duro toda mi vida. Merezco cosas buenas en la vida.\n\nEl rey David sabía mucho sobre justificarse. Nunca sabremos la historia exacta que se contó a sí mismo antes de llevar a Betsabé a su cama y luego asesinar a su inocente esposo, Urías, para encubrir su pecado (para saber la historia completa, lee 2 Samuel 11-12). Pero sabiendo cómo funcionan nuestras mentes, supongo que se dijo a sí mismo algo como esto: Merezco un poco de tiempo libre. He peleado y ganado muchas batallas. Ahora necesito desconectarme.\n\nLuego, al pasear por el techo de su palacio para relajarse, tal vez mientras disfrutaba de su bebida favorita, el rey notó a una hermosa mujer varias puertas más allá.\n\nGuau... mira eso. ¿Quién es esa chica en el techo? Me siento bastante solo. Me encantaría tener compañía. Me gustaría poder","49":"conocerla. Solo voy a averiguar quién es. No haré nada. Solo necesito a alguien con quien hablar.\n\nLuego, después de ordenar a su sirviente que fuera a buscarla y la trajera al palacio, sus justificaciones seguramente continuaron.\n\nElla está sola. Su esposo probablemente ni siquiera tenga idea de lo que tiene. Soy el rey. Merezco un poco de atención. Nadie lo sabrá jamás. Además, tengo mis necesidades.\n\nIncesantemente, paso a paso, David se dijo a sí mismo mentira tras mentira.\n\nEn mi propia vida, he aprendido que estar a la defensiva es una señal de que debo prestar mucha atención y estar abierto a lo que Dios quiera mostrarme. Si alguien está sugiriendo un cambio en tu vida y tú reaccionas a la defensiva, sería prudente que, en lugar de protestar, escucharas. Si sientes que Dios te está intentando señalar algo y tú te apresuras a decirle por qué no necesitas cambiar, esta es una señal clara para hacer una pausa y prestar atención a su advertencia.\n\nHe descubierto que cuanto más convencido estoy de que tengo razón en algo, es más probable que me equivoque.\n\nAprendí esto de la manera difícil, por supuesto. Cuando era un pastor joven, muchas personas sabias se acercaron y me dijeron que ocasionalmente era demasiado crudo en mi manera de predicar. Les preocupaba que mi humor fuera, en el mejor de los casos, subido de tono, y en el peor, inapropiado.\n\nNo cambié.\n\nPoco sabían ellos que yo tenía una estrategia. Como un tipo que fue rechazado por predicadores demasiado religiosos, santurrones, iba a mostrarles a todos que yo era un tipo normal y que me divertía como la gente normal. Y que tenía un sentido del humor que haría disfrutar a las personas.\n\nEl problema estaba en que mi estándar era conectarme con las personas, pero no honrar a Dios.","50":"Después de que docenas de personas trataron de ayudarme a ver el error de mis actos, finalmente un tipo me ayudó a ver la luz. Después de visitarme por unos minutos durante el almuerzo, probó un acercamiento diferente para ayudarme a ver mis problemas. Comenzó felicitando sinceramente mi forma de predicar. Le encantaba mi pasión. Reconoció que yo estudiaba fielmente. Admiraba mi valor para predicar sobre temas difíciles. Entonces comenzó a alentarme acerca de mi fe en Dios. Me dijo sinceramente que sabía que amaba a las personas que necesitaban a Cristo y que quería honrar a Jesús en mi manera de vivir.\n\nMientras continuaba fortaleciéndome con sus palabras, me dijo que sabía que yo estaba al tanto de que muchas personas se preocupaban por mi humor crudo. Este hombre sabio me dijo que confiaba en mí y que, en caso de que yo tuviera un problema, sabía que yo escucharía a Dios. En lugar de acusarme, simplemente me animó. «¿Le puedes pedir a Dios que te muestre si esto es algo que Él quiere que cambies?».\n\nDebido a su espíritu amoroso, accedí a pedir eso a Dios. A decir verdad, no pensaba escuchar nada diferente de Él. Dios conocía mi corazón. Dios entendía mi plan.\n\nAsí que simplemente hice una oración peligrosa. «Muéstrame si me equivoco, Dios. Muéstrame si necesito cambiar».\n\nNo pasó nada.\n\nNada en absoluto.\n\nHasta la próxima vez que prediqué.\n\nSucedió que era el «fin de semana de promoción», cuando los niños de la iglesia pasaban a un nuevo grado o clase. Ese fin de semana, mi hija mayor, Catie, se había graduado de la iglesia de los niños y ahora tenía la edad suficiente para adorar en la «iglesia grande» todas las semanas.","51":"Luego de transcurridos varios minutos de mi mensaje, prediqué con confianza y pasión, mirando a un lado para ver a mi preciosa hija sentada junto a Amy (quien también pensaba que mi humor iba demasiado lejos). Justo antes de contar un chiste que algunos habrían considerado cuestionable, me di cuenta: no quiero que mi hija escuche esto. Nunca quisiera que ella dijera esto. Y en aquel instante, Dios me hizo entender. Las personas tenían razón. Yo era el equivocado. Sin saberlo, había sido grosero, había deshonrado a Dios y había sido irrespetuoso con tantas personas maravillosas.\n\nEse lugar en el que había estado más seguro de tener razón era el lugar en el que estaba más equivocado.\n\nNegar la verdad no cambia los hechos.\n\nEstaba pecando contra mi Dios y fue necesario hacer una oración peligrosa para aceptar la dolorosa verdad.","53":"¿Estás listo para hacer esta oración peligrosa? ¿Estás preparado para escuchar lo que Dios podría mostrarte mientras lo haces? ¿Tienes la fe para pedir y el valor para obedecer?\n\nDios, examina mi corazón.\n\nRevela mis pensamientos ansiosos.\n\nVe si hay algún comportamiento ofensivo en mí.\n\nY guíame por el camino eterno.\n\nCada frase de este clamor lleno de fe es importante. Pero está incompleto sin la oración apasionada final: guíame por el camino eterno.\n\nNo queremos que Dios solo nos muestre la impureza de nuestro corazón. Queremos más que simplemente conocer nuestros pensamientos temerosos y ansiosos. Deseamos algo más que saber cómo somos ofensivos. Queremos que Dios nos lidere, nos dirija, nos guíe para convertirnos en quien Él quiere que seamos.\n\nGuíanos por el camino eterno.\n\nCuando hagas una pausa para hacer esta oración y escuches, Dios te hablará. Pero no tomes esta oración a la ligera. No la hagas a medias. Esto no es un juego o un pequeño ejercicio espiritual","54":"estéril para ayudarte a tener un mejor día. Esta es una oración que limpia el alma, repara el corazón y altera la eternidad.\n\n«Guíame».\n\nMientras reflexiono acerca de mi viaje espiritual a través de esta oración, permítanme recapitular lo que Dios me ha estado mostrando.\n\n1. Examina mi corazón, Dios. Dios me mostró mi hipocresía. A menudo le muestro a la gente el yo que quiero que vean. Mis palabras honran a Dios, pero mi corazón puede estar lejos de él.\n\n2. Conoce mis pensamientos ansiosos. Tengo mucho miedo de no estar a la altura. Estoy atormentado por mis inseguridades. Estoy paralizado por el miedo de no tener lo que se necesita para complacer a las personas.\n\n3. Ve si hay algún comportamiento ofensivo en mí. Una y otra vez, he dado más importancia a la aprobación de las personas que a la aprobación de Dios. He luchado con querer agradar a la gente más que con querer expresar mi amor por Dios.\n\n4. Guíame. Y aquí llega el momento de la verdad. Aquí es donde las cosas se vuelven reales. Aquí es donde se vuelve posible un cambio genuino, uno que está lleno del Espíritu y que puede alterar tu vida.\n\nCuando reúno todas las partes de esta oración peligrosa y escucho lo que Dios quiere mostrarme, queda claro: siempre he luchado por poner la aprobación de las personas antes que la aprobación de Dios. Este es quizás mi defecto espiritual más profundo. Es pecado. Me impide servir a Dios con todo mi corazón. ¿Por qué? Porque obsesionarse con lo que la gente piensa de mí es la forma más rápida de olvidar lo que Dios piensa de mí. Estar","56":"palabra. Llevar es una respuesta pasiva a algo que está sucediendo».\n\nYo permanecía pendiente de cada palabra mientras mi preciosa hija le daba a su padre-pastor una lección espiritual. Continuó: «Yo acepto esta situación por completo. Con todo mi ser, creo que Dios la está usando para ayudarme a conocerlo mejor y ayudar a otros a que lo conozcan también».\n\nLimpiando las lágrimas, tuve que reconocer que Dios la había acercado a Él aún más. Y en lugar de permitir que su condición física le robe la oportunidad de hacer la diferencia, cuando Mandy no puede salir, graba mensajes alentadores desde su casa. Al momento de escribir este libro, más de diez mil personas están suscritas a su canal de YouTube para escuchar acerca de su esperanza y fe en Cristo.\n\nDios hará lo mismo por ti.\n\nEn cualquier aspecto en el que te sientas débil, su fuerza está ahí.\n\nEn cualquier aspecto en el que estés sufriendo, su consuelo está disponible.\n\nCuando seas tentado, su gracia te dará una salida.\n\nPermite que tus miedos te lleven a Dios. El temor a Dios es la única cura para el temor a las personas. Si luchas contra la lujuria, deja que la Palabra de Dios renueve tu mente. Si tropiezas con el orgullo, humíllate y Dios te levantará. Si ocultas un pecado secreto, encuentra el perdón confesándolo a Dios y la sanación confesándolo a personas confiables.\n\nPídele a Dios que te muestre la verdad. Porque la verdad te hará libre. ¿Estás cansado de oraciones aburridas, seguras y estériles? ¿Estás atrapado en una rutina espiritual? ¿Tu fe está entumecida? ¿Tu pasión baja? ¿Deseas más? ¿Estás listo para obedecer?\n\nLuego, aventúrate en las aguas profundas de la comunicación con Dios. Abre tu corazón a la sanación de un Dios divino. Adéntrate en la belleza del perdón y la gracia de Dios. Busca su amor","57":"inagotable, incondicional e insaciable. Y ten el valor de hacer esta oración peligrosa. Pero no te limites solo a hacerla. Responde a lo que te muestra. Adéntrate en tu mayor temor y hacia la fe. Acoge tu necesidad más profunda y deja que te lleve a depender de Cristo.\n\n¿Estás listo?\n\n«Examíname, Señor».","61":"Hace años, Bruce Wilkinson escribió un libro superventas llamado La oración de Jabes. Se enfocaba en un par de versículos de la Biblia en el Antiguo Testamento. Si nunca has oído hablar de Jabes, no es de extrañar. Solo se menciona tres veces en la Biblia, por lo que no conocemos muchos detalles sobre él. Si bien se nos dice que era honorable (1 Crónicas 4:9), el nombre Jabes en realidad significa «que causa dolor». Su madre lo llamó Jabes porque su nacimiento le había causado mucho dolor (v. 9). La mayoría de los estudiosos de la Biblia creen que su nacimiento debe haber sido excepcionalmente doloroso o traumático para que su madre le diera ese nombre.\n\nQuizás por eso Jabes hizo esta oración en particular: «¡Oh, si me dieras bendición, y ensancharas mi territorio, y si tu mano estuviera conmigo, y me libraras de mal, para que no me dañe!» (v. 10). Se nos dice que Dios le concedió esta solicitud.\n\nCuando leí el libro de Wilkinson, me sorprendió la sencillez de esta oración. Bendíceme. Ensancha mi territorio. Que tu mano esté conmigo. Líbrame del daño y del dolor. Este es el tipo de oración que todos queremos hacer, ¿verdad? Bendíceme (dame más de lo","62":"que quiero). Protégeme (mantén alejado de mí lo que no quiero). Tiene sentido, ¿verdad?\n\nAunque he orado diferentes versiones de esta oración, demasiadas veces para contarlas, me he visto obligado a aceptar sus limitaciones. Esta oración, aunque bíblica y útil, se enfoca en lo que queremos, no necesariamente en lo que Dios quiere. Es segura. Es cómoda. Alguien podría incluso argumentar que es poco acertada, incluso egoísta.\n\nLibrarme del daño y del dolor tiene sentido. ¿Quién quiere tener dificultades? ¿Quién quiere tener que luchar? Pero me pregunto si igualmente podríamos estar orando: «Dios, no me dejes crecer. No dejes que me haga más fuerte. No me dejes confiar más en ti». Aunque las pruebas nunca son divertidas o fáciles de soportar, Dios a menudo las puede usar para sus propósitos. De hecho, Santiago, el medio hermano de Jesús, fue lo suficientemente valiente para decirnos que debemos estar agradecidos por la forma en que Dios usa las dificultades para perfeccionarnos: «Hermanos míos, tened por sumo gozo cuando os halléis en diversas pruebas, sabiendo que la prueba de vuestra fe produce paciencia. Mas tenga la paciencia su obra completa, para que seáis perfectos y cabales, sin que os falte cosa alguna» (Santiago 1:2-4).\n\nSi oramos solo para protegernos de las pruebas, entonces nos negamos a nosotros mismos nuestra madurez futura. «Señor, mantenme libre de dolor» se siente como algo apropiado que pedir, y a menudo lo es. Pero si ese es nuestro único deseo, nuestra mayor prioridad, entonces podemos perder la perseverancia que producen nuestras pruebas. «Dios, protégeme del daño» parece algo sensato que pedir, y puede serlo. Pero son los desafíos de la vida los que nos ayudan a madurar y acercarnos más a Cristo.\n\nEstá bien orar por seguridad y bendiciones, pero ¿y si quieres más? ¿Qué pasa si deseas el poder del Espíritu Santo, la fuerza del","63":"cielo, una fe inquebrantable, una intimidad genuina con tu Padre? En lugar de simplemente pedirle a Dios que te mantenga a salvo, te dé más y proteja tu vida, es posible que tengas que pedirle a Dios que te quebrante.","73":"Mirando hacia atrás, ahora veo por qué mi pequeño grupo reaccionó de la manera en que la mayoría de nosotros lo hacemos cuando consideramos orar algo tan arriesgado, realmente osado, como «quebrántame». Pero también sospecho que la mayoría de nosotros no nos damos cuenta de que, al ir a lo seguro, corremos el riesgo de perder algo mucho más valioso que nuestra seguridad y comodidad. No nos damos cuenta de las bendiciones que podríamos encontrar al otro lado del quebrantamiento de Dios.\n\nVeo que estas bendiciones emergen en dos escenas poderosas de la vida de Cristo. Ambas se describen en el libro de Marcos, curiosamente, una tras otra. Si bien pueden parecer no relacionadas en la superficie, hay un tema muy consistente. Algo debe quebrarse para que algo más se pueda liberar.\n\nEn el primer ejemplo, Marcos describe la dramática escena en la que una visitante no deseada se aparece en una cena donde Jesús era un invitado. La visitante era una prostituta y los tiempos","74":"no han cambiado mucho con respecto a cómo estas mujeres son vistas por los demás. La mayoría de las mujeres las desprecian. La mayoría de los hombres las ven como objetos de transacción o las juzgan o ambas cosas. Pero hay que tener en cuenta que ninguna mujer crece aspirando a ser una dama de la noche, como solía llamarlas mi abuela. En la mayoría de los casos, la desesperación lleva a una persona a vender su cuerpo para sobrevivir. Es probable que muchas se sientan impotentes, atrapadas sin opciones para poder mejorar su vida.\n\nLo mismo sucedía en los días de Jesús. Si una mujer joven se convertía en prostituta, era solo porque estaba desesperada más allá de toda medida. No habría encontrado ninguna otra opción. Quizás era madre soltera y temía que sus hijos pasaran hambre. Tal vez la habían vendido como esclava y no veía otra salida. Quizás había sido abusada durante toda su vida, no tenía autoestima y simplemente no creía que fuera digna de nada más que usar su cuerpo para sobrevivir.\n\nNo conocemos muchos detalles sobre la mujer de la historia. Pero sabemos lo que hacía para ganarse la vida. Y sabemos que, en algún lugar, en algún momento, de alguna manera, se encontró con el amor de Cristo. No sabemos exactamente cuándo conoció a Jesús o qué le dijo. No sabemos si otros observaron su transformación o si ella experimentó el amor de Dios sola en algún lugar de un camino de tierra. Lo único que sabemos con seguridad es que conoció a Cristo. Y que ella sabía con certeza que Jesús era diferente.\n\nDe alguna manera, en algún momento, Él le mostró su amor incondicional cuando ella solo había conocido el abuso. La trató con dignidad. Él le mostró respeto. La honró cuando los demás la colmaban de vergüenza. Jesús le habría mostrado el mismo amor, la misma gracia, la misma misericordia que le ofreció a todos los pecadores arrepentidos que había conocido. Aunque ella habría estado llena de vergüenza, él la ayudó a sentirse digna. Aunque ella","75":"se habría sentido despreciable, él le mostró que tenía valor. Aunque ella era culpable de pecado, Jesús le ofreció su gracia.\n\nEntonces esta mujer quiso hacer algo para mostrar su gratitud. Sabiendo que Jesús y sus discípulos estaban en casa de Simón el Leproso, entró para dar las gracias a su Redentor. Ya se tratase de algo premeditado o espontáneo —no está claro—, el valor de su extraordinaria ofrenda es evidente. Trajo con ella lo que posiblemente era su posesión más preciada, un frasco caro de perfume exótico, y en un acto de adoración y devoción desenfrenadas: «quebrando el vaso de alabastro, se lo derramó sobre su cabeza» (Marcos 14: 3).\n\nA primera vista, esto puede no parecer gran cosa. ¿Entonces quebró un frasco de Chanel? ¿Y qué? Pero su audiencia reconoció de inmediato la importancia de este regalo en múltiples niveles. Primero, estaba el valor del perfume. Aquel tesoro raro y caro le habría costado a alguien el salario de un año para comprarlo.\n\nPiensa en eso. ¿Cuánto ganas en un año? Ahora imagínate, en un momento, con una sola muestra de adoración, dándole toda esa cantidad a Jesús. Eso es lo que esta mujer hizo. Quebró el frasco y lo dio todo.\n\nRecuerda, esta mujer no estaba haciendo un trabajo que amaba. Un año de salario equivale a un año de vergüenza. Un año de humillaciones. Un año de pecado. ¿Cuántos encuentros terribles tuvo en ese año? ¿Cuántos hombres la usaron y la despreciaron? Sin embargo, ella quebró la botella y adoró a Jesús.\n\nEste regalo repentino impactó a algunas de las personas en la habitación. Aturdidas, se decían indignadas la una a la otra: «¿Para qué se ha hecho este desperdicio de perfume? Porque podía haberse vendido por más de trescientos denarios, y haberse dado a","76":"los pobres’. Y murmuraban contra ella» (Marcos 14: 4-5). Quizás tú y yo hubiéramos reaccionado de la misma manera. Parece un desperdicio, un truco audaz.\n\nPero no era solo un truco. La magnitud de este acto de devoción desinteresada no terminaba con el valor monetario del contenido del frasco.\n\nEn aquellos tiempos, el perfume era algo tan raro que las mujeres comunes no pensaban en comprar o usar perfume. Simplemente no era factible. Costaba demasiado. Entonces, ¿qué personas estaban dispuestas a gastar mucho dinero en fragancias? A las mujeres les gusta esta interrogante. Algunos teólogos creen que las únicas mujeres que usaban perfume eran «las mujeres de la calle». La fragancia era una forma de publicidad. Aquellas que usaban perfume estaban enviando un mensaje osado y fragante: «Estoy disponible... por un precio».\n\nEntonces, cuando esta mujer quebró la botella y derramó el valioso perfume, no solo se estaba desprendiendo del dinero que había ganado. Se estaba desprendiendo de su pasado, su profesión, su sustento. El perfume no solo representaba el trabajo que solía hacer; también representaba lo que podría utilizar para impulsar futuros «negocios». Cuando quebró la botella, cerró puertas. No había marcha atrás. Ella derramó todo el perfume sobre Jesús, como un símbolo de que le entregaba toda su vida.\n\nQuebró el frasco y lo derramó todo.\n\nLo liberó. Se entregó.\n\nSu acto comunicó más que cualquier palabra.\n\nJesús, aquí está mi vida.\n\nEs toda tuya.\n\nNo estoy guardando nada.\n\n«Señor, puedes tenerlo todo».","77":"De quebrar frascos de perfume, Marcos cambia nuestra atención a otra escena en la que el mismo Jesús partió algo. No era un frasco de perfume, sino pan en la mesa que compartía con sus discípulos. Y esta no era una comida cualquiera, sino la que se conoce como la última cena, la reunión final de Jesús, antes de su muerte, con todos sus amigos más cercanos y de mayor confianza. En esta comida íntima, Jesús les ofreció pan y vino, usando el grano y la uva como apoyos visuales para presagiar su sufrimiento y muerte inminentes. Luego invitó a sus discípulos a celebrar la misma comida simbólica en memoria de él durante los años venideros: «Y mientras comían, Jesús tomó pan y bendijo, y lo partió y les dio, diciendo: ‘Tomad, esto es mi cuerpo’. Y tomando la copa, y habiendo dado gracias, les dio; y bebieron de ella todos. Y les dijo: ‘Esto es mi sangre del nuevo pacto, que por muchos es derramada’» (Marcos 14:22–24).\n\nObserva exactamente lo que hizo Jesús. Partió el pan y explicó que este partimiento simbolizaba lo que le sucedería a él, a su cuerpo. Estaría partido, magullado y aplastado. Su espalda sufriría las marcas de una flagelación brutal. Su rostro estaría ensangrentado por los puños y su cabeza atravesada por una corona","78":"de espinas. Sus manos y pies estarían clavados a vigas de madera. Permanecería colgado recibiendo los escupitajos de la multitud. Se burlarían de él. Lo maldecirían. Jesús estaría rodeado por dos ladrones culpables, aunque Él no habría hecho nada malo. Jesús lucharía por recuperar el aliento. Clamaría a Dios con dolor. Perdonaría a los que lo colgaron. Y daría su vida por nosotros.\n\nComo el pan que partió en la mesa, el cuerpo de Jesús sería partido. Luego, después de compartir el pan con sus discípulos, Jesús levantó una copa de vino. Jesús explicó lenta, deliberada y amorosamente que el vino representaba su sangre. En poco tiempo, derramaría su sangre para cubrir los pecados de los hombres culpables. Él era el Cordero de Dios. El Cordero del sacrificio sería inmolado.\n\nCuando Jesús miró a los ojos de los que Él había elegido, supo que Pedro lo negaría y Judas lo traicionaría. Sin embargo, continuó amándolos y les explicó que debía ofrecer su vida (Marcos 14:12–31). Como Él les había dicho antes, «No hay un amor más grande que el dar la vida por los amigos» (Juan 15:13 NTV).\n\nSu cuerpo sería quebrantado y su sangre derramada.\n\nEl Evangelio de Lucas describió la misma cena, pero señaló algo que Marcos no mencionó. Lucas dijo: «Y [Jesús] tomó el pan y dio gracias, y lo partió y les dio, diciendo: ‘Esto es mi cuerpo, que por vosotros es dado; haced esto en memoria de mí’» (Lucas 22:19).\n\nCasi todos los eruditos de la Biblia están de acuerdo en que la instrucción de Jesús de «haced esto» proporciona a los creyentes una forma de recordar, honrar y celebrar su muerte y resurrección. Como resultado, durante siglos, los seguidores de Cristo se han reunido y compartido en este acto de partir el pan, ofrecer vino y participar de ambos en un acto de adoración. Conocida","80":"conocen de primera mano la bendición de vivir quebrantados y derramados.\n\nEs difícil imaginar lo que los discípulos debieron haber pensado y sentido en ese momento con el Hijo de Dios reunido alrededor de la mesa. No querían que muriera. Lo más probable es que no creyeran que ocurriría. Así que me pregunto si los recuerdos de las cosas que Jesús había dicho anteriormente inundaron sus mentes. «Oh ... guau ... ahora tiene sentido. Jesús nos dijo que si queríamos ser sus discípulos tendríamos que negarnos a nosotros mismos, tomar nuestra cruz y seguirlo» (ver Mateo 16:24).\n\nNosotros también debemos morir para nosotros mismos, para poder vivir para él. Quebrantados y derramados.\n\nEntonces, los discípulos tal vez recordaron lo que había dicho Jesús después de invitarlos a tomar su cruz. Era tan confuso en ese momento. No tenía sentido en ese contexto caminar junto a Jesús, hablando con Él. Ahora, a la luz del momento, tenía más sentido. Jesús dijo: «Porque todo el que quiera salvar su vida, la perderá; y todo el que pierda su vida por causa de mí, la hallará» (Mateo 16:25). Jesús no nos invita a una vida de comodidad y tranquilidad, sino de entrega y sacrificio. Nuestro mayor deseo no debería ser que se haga nuestra voluntad, sino que se haga la suya. Y Jesús nos invita a morir en nuestras propias vidas, para que podamos vivir momento a momento, día a día, para Él. Dejar nuestras acogedoras salas de estar y nuestras oraciones seguras para saber lo que significa ser quebrantados por el bien de los demás.\n\n¿Qué pasaría si cuando Jesús dijo «haced esto», no solo estaba hablando de un ritual que hacemos de vez en cuando en la iglesia? ¿Y si también nos estuviera invitando a ser quebrantados y derramados diariamente? ¿Y si nos estuviera invitando a una vida","81":"de humildad, sacrificio, generosidad y alegría? ¿Qué pasaría si en lugar de orar Señor, cuídame, protégeme y bendíceme, invitáramos a Dios a hacer algo más profundo en nuestras vidas?\n\n¿Qué pasaría si reconociéramos que las cargas pueden, con la ayuda de Dios, convertirse en bendiciones? ¿Qué pasaría si aceptáramos la verdad de que los problemas pueden hacernos más fuertes? ¿Que las pruebas pueden fortalecer nuestra fe? ¿Que el dolor puede hacernos más compasivos ante la difícil situación de los demás? ¿Que el sufrimiento puede acercarnos más a Cristo?\n\n¿Qué pasaría si tuviéramos el valor, la audacia, la fe para orar Quebrántame, Señor? ¿Qué pasaría si nosotros también viviéramos vidas quebrantadas y derramadas por Cristo?","83":"Al momento de comenzar nuestra iglesia, mi mentor Gary me había hecho una promesa audaz, una que yo jamás hubiera imaginado escuchar: «Dios te quebrantará».\n\nMostró tanta confianza en su declaración profética que nunca dudé de él. No solo estaba seguro de que Dios eventualmente me quebrantaría, sino que él estaba aún más seguro de que Dios lo usaría. El «quebrantamiento» me haría mejor. Mejoraría mi liderazgo. Profundizaría mi fe. Incrementaría mi intimidad con Jesús.\n\nEntonces comencé a hacer una de las oraciones más peligrosas que cualquiera puede hacer. «Dios, confío mucho en ti. Sé que me amas, que siempre estás trabajando dentro de mí. Si quieres hacer algo más en mí, hazlo. Si es doloroso, agradezco el dolor. Si quieres enviarme pruebas para fortalecerme, edificar mi fe, acercarme a ti, entonces hazlo. Dios, haz lo que sea necesario para liberarme de mi amor por este mundo, para crucificar mi amor por la comodidad. Dios, quebrántame».","84":"Aunque Dios no dice que sí a todas mis oraciones, de alguna manera, sabía que era probable que respondiera a esta. Creyendo que vendría «el quebrantamiento», me preparé. Seguramente sucedería. Ahora. Hoy. O si no mañana. Pronto. Dios me quebrantaría. Aunque confiaba en Él, todos los días esperaba y me preguntaba: ¿sucederá hoy?\n\nMoría de suspenso y miedo. ¿Recuerdas esos viejos juguetes que eran como una caja sorpresa con los que jugabas cuando eras niño? Accionabas la palanca en el costado de una pequeña caja mientras sonaba una música espeluznante. Daba vueltas y vueltas, y aunque no sabías cuándo sucedería, sabías que solo faltaban unos segundos. Sucedería. En algún momento, un muñeco saldría repentinamente de la caja y te asustaría (en una nota al margen, ¿por qué alguien pensó que terror-en-una-caja sería un buen juguete para niños pequeños?). Así me sentía. Todos los días, la palanca giraba. La música sonaba. Y cuando menos lo estuviera esperando, la caja se abriría. Y Dios me quebrantaría.\n\nHabía escuchado que comenzar una iglesia era difícil. Todos los que me dijeron eso tenían razón. A pesar de que experimentamos tantas cosas buenas, bendiciones y vidas cambiadas, el peso de la responsabilidad, el trabajo duro y los sacrificios a menudo se sintieron insoportables.\n\nUnos meses después, nuestra iglesia perdió las instalaciones que estábamos alquilando y nos quedamos sin un lugar para reunirnos. Dios, ¿qué estás haciendo? Luego, un reportero de noticias escribió un artículo mordaz sobre mí que cuestionó mis motivos y creó rumores y chismes que lastimaron a mi familia. Dios, ¿por qué permitiste que sucediera eso? La carga de trabajo era aplastante, las horas agotadoras, la responsabilidad abrumadora. Dios, no sé si lo lograré.\n\nComo pastor joven, cometí errores de liderazgo que lastimaron a la gente. Los amigos cercanos se enojaron y abandonaron la","85":"iglesia. Tuve que despedir a los miembros del personal. Uno era un amigo cercano. Eso se sintió como una muerte. Uno era un miembro de la familia. Eso se sintió peor que una muerte.\n\nA medida que se desarrollaba cada evento doloroso, llamaba a Gary y le preguntaba: «¿Ya estoy quebrantado?». Gary me contestaba gentilmente: «Todavía no».\n\nDespués de varias rondas de la misma conversación, Gary finalmente me dijo: «Craig, cuando estés quebrantado, lo sabrás. No habrá duda. No tendrás que preguntarlo».\n\nTenía razón.","117":"Cuando era niño, quería sentir la presencia de Dios. Especialmente en la iglesia —después de todo, esa es la casa de Dios, ¿no?— esperaba sentir algo sobrenatural, a falta de una palabra mejor. Sentir la piel de gallina hubiera sido genial. Un cosquilleo por mi columna hubiera sido genial. Podía imaginar su paz y consuelo mientras una especie de calor celestial irradiaba dentro de mí. Pero nunca sucedió. La mayoría de las veces me sentía incómodo con la ropa de vestir que mis padres me hacían llevar a la iglesia y me preguntaba cuánto tiempo faltaba para que pudiéramos irnos y almorzar.\n\nSi bien todas estas sensaciones son posibles, he descubierto que los encuentros con Dios suelen ser más que cosquilleos en el cuerpo o la calidez que se siente al cargar a un cachorro. Pero antes de que podamos encontrarnos con Dios, a menudo es útil lidiar con el pecado en nuestras vidas. Para llegar verdaderamente a un punto de sumisión y disponibilidad a Dios, y para estar plenamente conscientes de su presencia, es sabio reconocer y comprender nuestra pecaminosidad.\n\nSolo el decir que somos «pecadores» ofende a mucha gente hoy en día. En nuestra cultura, hay gurús de la autoayuda y expertos","118":"en motivación que nos dicen que rechacemos la idea de que somos pecadores. Que deberíamos amarnos a nosotros mismos tal como somos. Que no es necesario cambiar a menos que queramos cambiar, y entonces podemos hacerlo nosotros mismos.\n\nDe hecho, recientemente estaba hablando con un muchacho en el gimnasio que me decía que no necesitaba a Jesús en su vida. Con total confianza, me dijo que, aunque Jesús era probablemente una persona real y tal vez incluso el Hijo de Dios, Jesús era inútil para él. Cuando le pregunté si alguna vez había tenido alguna necesidad de perdón, el hombre respondió enérgicamente: «Absolutamente no». Explicó que era una «buena persona» y mucho mejor que muchos cristianos que conocía. ¿Por qué tendría que ser perdonado si no era malo?\n\nAunque estoy seguro de que este muchacho hacía muchas cosas buenas, traté de ayudarlo a reconocer que, en el fondo, ninguno de nosotros es bueno. Debido a la rebelión en el jardín del Edén, heredamos lo que se llama la naturaleza pecaminosa de Adán. El apóstol Pablo explicó de esta manera: «Como el pecado entró en el mundo por un hombre, y por el pecado la muerte, así la muerte pasó a todos los hombres, por cuanto todos pecaron» (Romanos 5:12).\n\nCuando vemos lo bueno que es Dios, nos damos cuenta plenamente de lo buenos que no somos. Su santidad revela nuestra pecaminosidad. Esto es lo que le pasó a Isaías, y esto es lo que nos pasa a nosotros en la presencia de Dios. Cuando el profeta vio la gloria de Dios, no gritó: «Soy increíble. Soy santo y perfecto como Dios». No, Isaías reconoció las profundidades de su propia depravación y gritó: «¡Ay de mí! que soy muerto; porque siendo","119":"hombre inmundo de labios, y habitando en medio de pueblo que tiene labios inmundos, han visto mis ojos al Rey, Jehová de los ejércitos» (Isaías 6:5).\n\nIsaías no se limitó a decir: «Me equivoqué. Hice algunas cosas malas». Lloró desde un corazón desesperado: «¡Ay de mí!». La conciencia de la profundidad de su pecado trajo tristeza, remordimiento, dolor y un espíritu de arrepentimiento sincero. En la presencia de Dios, Isaías dijo: «Estoy arruinado». Otra versión traduce el texto hebreo original como «Estoy deshecho».\n\nEn una respuesta similar, Moisés ocultó su rostro, porque tenía miedo de mirar a Dios (Éxodo 3:6). Job dijo que se despreció o se aborreció a sí mismo cuando vio el poder de Dios (Job 42:6). Pedro cayó boca abajo a los pies del Señor y le dijo a Jesús que se apartara de él debido a su pecaminosidad (Lucas 5:8). Ninguno de nosotros es mejor que Moisés, Job o Pedro. Y algunos de nosotros incluso tuvimos experiencias similares cuando oramos a Dios por la salvación. Incluso si no caíste boca abajo, entregar tu vida a Jesús comienza con la conciencia de tu necesidad de ser salvado del pecado.\n\nPero ¿por qué debemos reconocer nuestro pecado? ¿No podemos simplemente empezar a seguir a Jesús y seguir adelante? ¿Por qué es tan importante ver lo egoístas y rebeldes que somos? Porque hasta que nos veamos a nosotros mismos como pecadores, nunca entenderemos completamente a Jesús como el Salvador.\n\nComo mi amigo en el gimnasio, durante años, yo también traté de justificar mi propia pecaminosidad, incluso después de convertirme en un seguidor de Dios. Después de todo, conocía a personas que eran mucho peores que yo. Nunca maté a nadie. No era pandillero ni abusador. Pero cuando comencé a hacer oraciones peligrosas, clamando a Dios y aprendiendo quién era Él, mi autoestima se convirtió en autoconciencia. Dios es justo. Yo soy injusto. Dios está lleno de gloria. Yo estoy lleno de mí mismo. Tuve que enfrentar la brutal verdad sobre mi pecaminosidad. Yo era egoísta.","120":"A menudo decía mentiras y a veces tomaba cosas que no eran mías. Envidiaba a los demás, codiciaba y deseaba las cosas brillantes que ofrecía este mundo.\n\nPero cuando hagas oraciones peligrosas, verás y entenderás más a Dios. Lo cambia todo. Isaías lo vio. Quizás tú también lo hagas. Cuando los seres angelicales cantaron sobre la santidad de Dios, Isaías supo que sus propios labios eran pecaminosos e inmundos. Veremos nuestra pecaminosidad en su totalidad solo cuando aceptemos la santidad de Dios. Siempre y cuando nos comparemos con otras personas, podemos engañarnos a nosotros mismos diciendo que no somos tan malos. Pero cuando nos comparamos con Dios, vemos cuán injustos somos en verdad. Como Isaías, cuando experimenté la presencia de Dios, me di cuenta de mi pecado. Esta conciencia me llevó luego a una comprensión más completa de la maravillosa gracia de Dios.\n\nUna de mis mayores épocas de crecimiento espiritual llegó cuando era un joven pastor asociado en la Primera Iglesia Metodista Unida en Oklahoma City. Por difícil que sea admitirlo, en muchos sentidos, estaba «interpretando un papel» más que «viviendo un llamado». Sintiendo la presión de estar a la altura de las expectativas, comencé a decir cosas que sonaban «pastorales», incluso si no eran completamente ciertas. Decía a las personas que iba a orar por ellas, incluso cuando sabía que probablemente no lo haría. Actuaba como si me encontrara cerca de Dios, a pesar de que estaba abrumado con el trabajo y no había pasado mucho tiempo con Dios en absoluto.\n\nUn jueves por la mañana, mientras me preparaba para predicar en lugar del pastor principal, sentí que Dios me abrió los ojos a mi pecado. La imagen que Dios me dio fue clara: me había convertido en un «pastor a tiempo completo» y un «seguidor de Cristo","121":"a tiempo parcial». Estaba mostrando una vida exterior que no era un verdadero reflejo de devoción interior. Entonces, en uno de mis movimientos de fe más peligrosos, descarté el sermón que estaba preparando y prediqué un mensaje más auténtico desde mi corazón confesando cómo me había alejado de Dios. Hasta el día de hoy, no sé si recuerdo a Dios hacer más en la vida de tantas personas de lo que hizo el día en que abrí mi corazón ante la familia de nuestra iglesia.\n\nEn lo más profundo de la desesperación de Isaías, él experimentó la profundidad de la gracia de Dios. Trató de expresar con palabras lo que sucedió cuando uno de los ardientes serafines voló en su dirección. El ser angelical llevaba un carbón al rojo vivo que había sacado directamente del altar de Dios. Cuando la criatura tocó los labios del profeta con el carbón encendido, el mensajero de Dios dijo: «He aquí que esto tocó tus labios, y es quitada tu culpa, y limpio tu pecado» (Isaías 6:7).\n\nImagina el poder del momento. Isaías nunca ha sido más consciente de su culpa, su pecado, su vergüenza. Y con un toque del ser de Dios, su pecado desapareció. Fue olvidado. Perdonado. Primero, gracia incondicional. Luego, gratitud incontenible.\n\nMis pecados son perdonados.\n\nNo hay nada mejor para alimentar tu vida de oración que un profundo aprecio por la gracia de Dios. Imagina a Dios borrando todas tus mentiras. Sanando tu odio. Limpiando tu pecado sexual.\n\nAcéptalo. Si estás «en Cristo», tus decisiones egocéntricas son perdonadas. Tu ira, perdonada. Odio, perdonado. Rencor, perdonado. Alarde, perdonado. Celos, perdonados. Envidia, perdonada. Todos tus pecados, tus malos pensamientos, tu codicia, tu hipocresía, tus chismes, tus lujurias secretas, tu orgullo, tu ingratitud, tu materialismo, tu incredulidad —todo perdonado y olvidado por la gracia de nuestro buen Dios.","122":"Más adelante en su vida, Isaías añadiría color a la gracia de Dios al citar al que lo perdonó, escribiendo: «Yo, yo soy el que borro tus rebeliones por amor de mí mismo, y no me acordaré de tus pecados» (Isaías 43:25). Cuando clamas a Dios por su perdón, Él no recuerda tus pecados. Desaparecen. Son perdonados. Limpiados. Y olvidados.\n\nDe la misma manera que el carbón quitó la culpa y el pecado de Isaías, la sangre de Jesús quita los nuestros. Mientras lees, espero que hagas una pausa lo suficientemente larga como para dejar que estas verdades se asimilen, calmen tu alma manchada por el pecado y te inspiren a hacer oraciones peligrosas.\n\nLa gracia. Cambia. Todo.\n\nNosotros no traemos nada.\n\nJesús lo trae todo.\n\nCuando sentimos su presencia, nos damos cuenta de nuestra pecaminosidad. Entonces nos quedamos eternamente en deuda con Él por su gracia extravagante, inmerecida e incomparable.\n\nEn el momento en que vemos a Dios por quien es, nos vemos a nosotros mismos por lo que no somos. Y debido a lo que Jesús hizo por nosotros y la gracia que nos prodiga, de repente la oración peligrosa de entrega no parece tan abrumadora. De hecho, aunque todavía peligrosa, puede parecer algo atractiva. Cuando Dios pregunta: «¿Quién irá? ¿A quién enviaré?», nuestra respuesta inmediata desde un corazón perdonado y entregado es la siguiente oración llena de fe y de completa disponibilidad: «Aquí estoy, Señor. Envíame».\n\nY cuando haces esta oración peligrosa, no es por obligación o culpa. Ya sabes, debido a lo que Jesús hizo por mí y todo eso, supongo que ahora me toca estar disponible para Él. No, es una oración atrevida de fe. Es la profunda conciencia de que tu vida no","123":"es tuya. Tú le perteneces a Dios. Tú eres su sirviente. Su embajador. Su representante en la tierra.\n\nTus oraciones pasarán de peticiones centradas en ti mismo —«Haz esto por mí, Dios. Ayúdame, Señor»— a oraciones centradas en Cristo, impulsadas por el Evangelio, que glorifiquen a Dios. «Donde quieras, Dios. Cuando quieras. Lo que tú quieras, soy tuyo».\n\nReconoce que el mismo Dios que te ha perdonado, también te ha llamado y elegido. Todos los días tiene citas programadas para ti. Personas a quien bendecir. Cosas que dar. Oportunidades para servir.\n\nCuando te entregues a Él, tendrás ojos para ver lo que hace. Un corazón para sentir lo que conmueve su corazón. Y manos para mostrar su amor.\n\nVerás a personas que necesitan ánimo, y su Espíritu te dará las palabras adecuadas. Verás a alguien que tiene una necesidad, y Dios te impulsará a que la satisfagas. Verás a alguien que está solo, y le mostrarás el amor de Dios. Tú eres su sirviente. Disponible. Deseoso y listo para actuar.","79a":"como la Sagrada Comunión, la Cena del Señor o la Eucaristía, esta participación del pan y del vino nos ayuda a recordar el sacrificio extraordinario, el precio que pagó Jesús, para que pudiéramos ser perdonados y estar en eterna comunión con el Padre.\n\nPero algunos eruditos creen, y yo estoy de acuerdo, que la instrucción de Jesús de «haced esto» incluía más que un simple y breve acto o ritual que involucraba pan y vino. Algunos creen que el «haced esto» de Jesús también se refiere a cómo debemos vivir. No solo recordamos a Jesús durante la Sagrada Comunión en la iglesia; lo recordamos en cómo vivimos nuestras vidas a diario. Porque el cuerpo de Jesús fue quebrantado, porque su sangre fue derramada por nosotros, también nosotros debemos vivir diariamente por él, quebrantados y derramados.\n\nPuede que esto no suene atractivo a primera vista. ¿Quién quiere ser «quebrantado» y «derramado»? Eso suena doloroso en el mejor de los casos, miserable en el peor. Pero es en la entrega de nuestras vidas donde encontramos la verdadera alegría. En lugar de perseguir nuestra voluntad, nos rendimos a la suya. En lugar de intentar llenar nuestras vidas con todo lo que queremos, las vaciamos para hacer una diferencia en las vidas de los demás.","79b":"Nuestros amigos Jerome y Shanna han acogido a tantos niños necesitados que ni siquiera estoy seguro de que puedan decirte a cuántos chicos lastimados han ayudado. En el proceso, han llorado incontables noches. Han sufrido por la decepción. Y han dado a pesar del dolor. Pero en su generosidad desinteresada, han encontrado alegría. Y cuando les pregunté si harían algo diferente, sin dudarlo, dijeron al unísono: «De ninguna manera. Se nos ha dado tanto. Ahora es nuestro momento de retribuir». Jerome y Shanna","31a":"eterno. Tiene que ver con lo que es fácil, no lo que es correcto. Está obsesionado con lo que queremos, no con lo que Dios quiere.\n\nPodrías pensar, no, yo no. Mi corazón es bueno. Recuerda por favor que, sin Cristo, no lo es. Si pensamos que lo es, estamos siendo engañados por nuestro propio corazón. Nuestra naturaleza original al nacer es pecaminosa. (Nunca tienes que enseñarle a un niño de dos años a ser egoísta, ¿verdad?). Nuestros caminos no son los caminos de Dios. Por eso necesitamos a Cristo. No solo para perdonarnos, sino para transformarnos, para redirigirnos, para hacernos nuevos.","31b":"Si todavía crees que eres inherentemente bueno, entonces déjame preguntarte, ¿con qué frecuencia mientes? Si respondes «no tan a menudo», probablemente estás mintiendo. Si respondes «nunca», entonces sé que estás mintiendo.\n\nLos estudios de investigación revelan que la mayoría de las personas dicen múltiples mentiras todos los días. No queremos herir los sentimientos de nadie. O deseamos quedar bien, así que exageramos. Pero las mentiras más comunes son las que nos decimos a nosotros mismos. ¿Alguna vez has hecho esto? Te dices a ti mismo lo que crees que es verdad en tu corazón: No comeré mucho. Lo prometo. Solo un par de bocados. Y de repente te ves con una bolsa vacía de papas fritas o lamiendo la sartén.\n\nTodos nos justificamos. A nadie le gusta enfrentarse a la desagradable verdad de que beben demasiado, piensan en cosas de las que sentirían vergüenza si se supieran, o se ríen de los errores de los demás y comentan a sus espaldas. Y las justificaciones continúan.","55a":"obsesionado con la aprobación de los demás es, en una palabra, idolatría.","55b":"Entonces pido a Dios ahora que me haga diferente. Más fuerte. Más confiado en Cristo. Más seguro en su amor y vocación. Y está funcionando. Mi manera de predicar es más arriesgada. Mi liderazgo es más ingenioso. Mi sensibilidad hacia su Espíritu es más fuerte. Y como me importa menos lo que piense la gente, me apasiona más lo que piensa Dios. Estoy menos enamorado de este mundo y mi mente está más centrada en la eternidad.\n\nGuíame.\n\nTe ruego. Examíname, Dios.\n\nConoce mis pensamientos ansiosos.\n\nVe si hay algún comportamiento ofensivo en mí.\n\nY guíame por el camino eterno.\n\nMientras lo haces, escucha lo que Dios dice. Permanece atento a lo que te muestra. Mira cómo conecta los puntos y señala tu necesidad más profunda. Pero no te desanimes. Permanece lleno de fe. Descubrir tu necesidad más profunda es un regalo. Es una oportunidad. Es una bendición.\n\nPorque tu necesidad más profunda se convierte en un regalo cuando te lleva a depender de Cristo. Esto es lo que estoy aprendiendo de mi hija, Mandy. Como mencioné anteriormente, ella ha estado luchando contra la fatiga crónica, la fibromialgia y otras complicaciones que han alterado su vida. Cuando le dije que estaba orgulloso de la forma en que estaba llevando la enfermedad, Mandy me detuvo a mitad de la frase.\n\n«Papá», dijo, corrigiéndome sutilmente, «he elegido no usar esa","62a":"que quiero). Protégeme (mantén alejado de mí lo que no quiero). Tiene sentido, ¿verdad?","62b":"Aunque he orado diferentes versiones de esta oración, demasiadas veces para contarlas, me he visto obligado a aceptar sus limitaciones. Esta oración, aunque bíblica y útil, se enfoca en lo que queremos, no necesariamente en lo que Dios quiere. Es segura. Es cómoda. Alguien podría incluso argumentar que es poco acertada, incluso egoísta.\n\nLibrarme del daño y del dolor tiene sentido. ¿Quién quiere tener dificultades? ¿Quién quiere tener que luchar? Pero me pregunto si igualmente podríamos estar orando: «Dios, no me dejes crecer. No dejes que me haga más fuerte. No me dejes confiar más en ti». Aunque las pruebas nunca son divertidas o fáciles de soportar, Dios a menudo las puede usar para sus propósitos. De hecho, Santiago, el medio hermano de Jesús, fue lo suficientemente valiente para decirnos que debemos estar agradecidos por la forma en que Dios usa las dificultades para perfeccionarnos: «Hermanos míos, tened por sumo gozo cuando os halléis en diversas pruebas, sabiendo que la prueba de vuestra fe produce paciencia. Mas tenga la paciencia su obra completa, para que seáis perfectos y cabales, sin que os falte cosa alguna» (Santiago 1:2-4).\n\nSi oramos solo para protegernos de las pruebas, entonces nos negamos a nosotros mismos nuestra madurez futura. «Señor, mantenme libre de dolor» se siente como algo apropiado que pedir, y a menudo lo es. Pero si ese es nuestro único deseo, nuestra mayor prioridad, entonces podemos perder la perseverancia que producen nuestras pruebas. «Dios, protégeme del daño» parece algo sensato que pedir, y puede serlo. Pero son los desafíos de la vida los que nos ayudan a madurar y acercarnos más a Cristo.\n\nEstá bien orar por seguridad y bendiciones, pero ¿y si quieres más? ¿Qué pasa si deseas el poder del Espíritu Santo, la fuerza del"};
const MARGIN_NOTES={"23":"Orar de corazón es personal e inconfundible.","27":"Si lo llamas, Dios te asegura que escucha los clamores de tu corazón.","35":"Me di cuenta de que cuanto más me acercara a Jesús, más tendría que enfrentar mis faltas.","36":"En lugar de simplemente pedirle a Dios que haga algo por ti, pide a Dios que te revele algo en ti.","38":"Aquello a lo que más tememos revela dónde confiamos menos en Dios.","40":"Nuestros miedos importan. Porque, en última instancia, nuestros miedos muestran cómo confiamos en nuestros propios esfuerzos y no confiamos en nuestro Salvador.","44":"Si eres como yo, eres bueno acusando a los demás e igualmente bueno excusándote.","46":"Proverbios 12:15 dice: «El camino del necio es derecho en su opinión; mas el que obedece al consejo es sabio».","47":"Necesitamos la ayuda de Dios para ver el pecado que es difícil de ver en el espejo.","50":"¿Le puedes pedir a Dios que te muestre si esto es algo que Él quiere que cambies?","51":"Ese lugar en el que había estado más seguro de tener razón era el lugar en el que estaba más equivocado.","57":"Adéntrate en tu mayor temor y hacia la fe. Acoge tu necesidad más profunda y deja que te lleve a depender de Cristo.","63":"Si oramos solo para protegernos de las pruebas, entonces nos negamos a nosotros mismos nuestra madurez futura.","73":"No nos damos cuenta de las bendiciones que podríamos encontrar al otro lado del quebrantamiento de Dios.","75":"¿Cuánto ganas en un año? Ahora imagínate, en un momento, con una sola muestra de adoración, dándole toda esa cantidad a Jesús. Eso es lo que esta mujer hizo. Quebró el frasco y lo dio todo.","76":"Jesús, aquí está mi vida. Es toda tuya. No estoy guardando nada.","78":"No hay un amor más grande que el dar la vida por los amigos (Juan 15:13 NTV).","80":"Porque todo el que quiera salvar su vida, la perderá; y todo el que pierda su vida por causa de mí, la hallará (Mateo 16:25).","83":"Dios, haz lo que sea necesario para liberarme de mi amor por este mundo, para crucificar mi amor por la comodidad. Dios, quebrántame.","85":"Cuando estés quebrantado, lo sabrás. No habrá duda. No tendrás que preguntarlo.","118":"Para llegar verdaderamente a un punto de sumisión y disponibilidad a Dios, y para estar plenamente conscientes de su presencia, es sabio reconocer y comprender nuestra pecaminosidad.","120":"Cuando hagas oraciones peligrosas, verás y entenderás más a Dios. Lo cambia todo.","122":"En el momento en que vemos a Dios por quien es, nos vemos a nosotros mismos por lo que no somos.","123":"Cuando te entregues a Él, tendrás ojos para ver lo que hace. Un corazón para sentir lo que conmueve su corazón. Y manos para mostrar su amor.","79a":"¿Quién quiere ser «quebrantado» y «derramado»? Eso suena doloroso en el mejor de los casos, miserable en el peor. Pero es en la entrega de nuestras vidas donde encontramos la verdadera alegría.","31a":"Nuestros caminos no son los caminos de Dios. Por eso necesitamos a Cristo. No solo para perdonarnos, sino para transformarnos, para redirigirnos, para hacernos nuevos.","31b":"Las mentiras más comunes son las que nos decimos a nosotros mismos.","55b":"Tu necesidad más profunda se convierte en un regalo cuando te lleva a depender de Cristo.","55a":"Siempre he luchado por poner la aprobación de las personas antes que la aprobación de Dios."};

function contentFor(d){let n=d.id;if(n===31)return "Nanichi lee las páginas 117–120. La oración de la página 117 continúa en la 118, y la de la 119 termina en la 120. La última oración de la 120 continúa en la página 121, con Betsy. Los destacados laterales repiten ideas del texto y se muestran aparte para no leerlos dos veces.";if(n===32)return "Betsy comienza en la página 121, completando la oración que termina la página 120, y lee hasta el final de la 123. Falta la fotografía de la página 124; consulta el libro antes de cerrar la narración. Los destacados laterales repiten ideas del texto y se muestran aparte.";if(n===29)return "Marco A. Colón lee desde la página 111 hasta «muchas personas dan a Dios por sentado», en la primera sección de la página 113. La oración del final de la 111 continúa al principio de la 112. El destacado lateral de la 112 repite una frase del texto; no se lee dos veces. Richard comienza en «Para algunas personas», página 113.";if(n===30)return "Richard comienza en «Para algunas personas», página 113, y continúa hasta «Comienza por experimentar la presencia de Dios», página 116. La última oración de la 113 continúa en la 114; la de la 114 continúa en la 115, y la de la 115 continúa en la 116. Los destacados laterales de la 113 y la 115 repiten frases del texto; no se leen dos veces.";if(n===27)return "Sandra lee desde la página 105 hasta «Aquí estoy, Señor. No voy a ir», en la página 108. Las oraciones continúan entre las páginas 105–106, 106–107 y 107–108. Richard comienza con «La segunda respuesta al llamado de Dios». El destacado lateral de la 106 repite el texto.";if(n===28)return "Richard comienza en la página 108 con «La segunda respuesta al llamado de Dios» y continúa hasta el cierre fotografiado de la página 109, «Aquí estoy yo. Envíame a mí». La pregunta de Moisés continúa de la 108 a la 109. El destacado lateral de la 108 repite el texto.";if(n===26)return "Carla abre la tercera parte, «Envíame», con Isaías 6:8 y lee las páginas 101–103. La oración final de la 101 continúa en la 102. Termina en «Envíame, Señor. Úsame». Los destacados laterales de las páginas 102 y 103 repiten el texto. La página 104 de la planificación inicial no fue recibida.";if(n===24)return "Meriemil lee desde la página 93 hasta «y dependen de él» en la 95. La oración final de la 94 continúa en la 95. La nota al pie se muestra aparte. Lymari comienza en el párrafo «Durante la última cena».";if(n===25)return "Lymari comienza en «Durante la última cena», página 95, y continúa hasta «Quebrántame, Señor», página 98. Las oraciones continúan entre las páginas 95–96, 96–97 y 97–98. Los destacados laterales repiten frases del texto. No se recibieron las páginas 99 y 100 de la planificación inicial; el cierre visible está en la 98.";if(n===22)return "Nanichi lee las páginas 89 y 90, hasta «destrozado, roto, marcado». La oración de la página 89 continúa al inicio de la 90. Yasmary continuará desde «Entre lágrimas» en la página 91.";if(n===23)return "Yasmary continúa en la página 91 desde «Entre lágrimas» y termina en la 92 con «Quebrántame, Señor». La oración final de la 91 continúa en la 92. Los dos destacados laterales de la 91 repiten el texto y se leen una sola vez.";if(n===21)return "Keishla lee el capítulo 2.7, «Camino equivocado», páginas 87 y 88. La oración final de la página 87 continúa en la 88 («y comenzó a gritarme»); léela de corrido. Termina en «Se había quitado la vida».";if(n===18)return 'Yamira lee el capítulo 2.5 desde la página 77 hasta la página 79. Termina después de «...hacer una diferencia en las vidas de los demás». No leas el párrafo que empieza «Nuestros amigos Jerome y Shanna»; es el inicio de la lectura de Mariluz al día siguiente. La frase al final de la página 77 continúa al principio de la 78; y la última frase de la 78 continúa en la página 79. Las notas laterales son citas repetidas, no párrafos adicionales.';if(n===20)return 'Damaris lee el capítulo 2.6, «Caja sorpresa», desde la página 83 hasta el cierre visible en la página 85: «Tenía razón». En la página 84, la última oración continúa en la 85 («abandonaron la iglesia»); léela de corrido. Los recuadros laterales de las páginas 83 y 85 repiten frases del texto: no se leen dos veces. La fotografía de la página 86 no se recibió; conviene confirmar con el libro si está en blanco antes de afirmar que la transcripción es íntegra.';if(n===19)return 'Mariluz continúa el capítulo 2.5 en la página 79, comenzando con «Nuestros amigos Jerome y Shanna han acogido...». Después lee las páginas 80 y 81 hasta la pregunta final «¿Qué pasaría si nosotros también viviéramos vidas quebrantadas y derramadas por Cristo?». La página 82 no aparece entre las fotografías facilitadas; el capítulo parece terminar en la página 81, pero conviene confirmar que la 82 esté en blanco antes de grabar.';if(n===13)return 'Marco lee la página 61 y el primer párrafo de la 62, hasta «Tiene sentido, ¿verdad?». La frase final de la 61 («dame más de lo») continúa en la 62 («que quiero»). Richard empieza mañana por el segundo párrafo de esa misma página.';if(n===14)return 'Richard comienza en la página 62, segundo párrafo: «Aunque he orado diferentes versiones de esta oración...». Lee desde allí hasta el final de la página 63: «...pedirle a Dios que te quebrante». La frase de la 62 que termina «la fuerza del» se completa en la 63 con «cielo». El destacado lateral de la 63 repite una idea del texto y no debe leerse dos veces.';if(n===1)return 'Lee las páginas 21, 22 y 23 completas, incluido el cierre en forma de pregunta. El capítulo termina allí: la página 24 está en blanco, según confirmó la coordinación. No se omite nada del capítulo.';if(n===2)return 'Lee las páginas 25, 26 y 27 completas, incluida la pregunta final de la página 27. El capítulo termina allí: la página 28 está en blanco, según confirmó la coordinación. No se omite nada del capítulo.';if(n===3)return 'Lectura íntegra de la primera parte: comienza en la página 29; lee toda la página 30 y la porción inicial de la 31. Termina justo antes del párrafo que comienza «Si todavía crees…». Nanichi continuará allí mañana.';if(n===11)return 'Lee la página 53, la 54 y el primer párrafo de la 55. La frase que termina en «Estar» en la página 54 se completa en la página 55 como «obsesionado con la aprobación de los demás es, en una palabra, idolatría». Detente después de esa palabra: Keila continuará mañana con el siguiente párrafo.';if(n===12)return 'Comienza en la página 55, en el segundo párrafo, «Entonces pido a Dios ahora que me haga diferente». Sigue con las páginas 56 y 57 hasta «Examíname, Señor». La frase al final de la página 55 continúa en la 56: «he elegido no usar esa palabra». No se omite ni se repite ninguna sección entre las dos jornadas.';if(n===9)return 'Lee íntegramente las páginas 43 a 47. La página 43 termina en «Si eres como yo,» y la página 44 continúa la oración. La página 45 termina con «Me» y la 46 comienza «estaba perdiendo mi vida». La página 46 concluye en «fácil», que conecta con «de transitar» de la 47. Termina la lectura en «Y las justificaciones continúan».';if(n===10)return 'Lee íntegramente las páginas 48 a 51, empezando por los seis ejemplos de justificaciones. La página 48 termina en «Me gustaría poder» y la 49 comienza «conocerla». Concluye con «aceptar la dolorosa verdad». El índice sitúa el capítulo siguiente en la página 53; no se ha recibido fotografía de la 52.';if(n===7)return 'Lee las páginas 37–39 completas. Ivoncita termina al concluir el párrafo de la página 39 que dice que el autor conoce el poder de hacer oraciones peligrosas; Lizbeth continúa mañana en la página 40.';if(n===8)return 'Lee las páginas 40–41 completas. La frase final de la página 40 continúa en la 41: «con mentiras». La lectura llega hasta «Confía en Él». La página 42 no añade texto, según el cierre compartido.';if(n===5)return 'Lee las páginas 33–34 completas. La página 33 termina en mitad de una oración que continúa al inicio de la página 34. La lectura termina con «Era tan hipócrita». Meriemil continuará mañana con la página 35.';if(n===6)return 'Lee las páginas 35–36 completas, incluida la nota lateral destacada de la página 36 (se muestra al final para no interrumpir la lectura). Es la conclusión íntegra del capítulo 1.4.';if(n===4)return 'Lectura íntegra de la segunda parte: comienza en la página 31 con «Si todavía crees…» y termina con la última línea de la página 32. No se omite ningún fragmento del capítulo entre las dos jornadas.';return 'La referencia y las fechas están planificadas. Todavía no tenemos digitalizadas las páginas de este capítulo; la lectura se incorporará íntegra, y el corte I/II solo se confirmará al ver el texto completo.'}
function bridge(d){if(d.id===30)return "<div class=\"readerintro\"><strong>Continuidad con Marco A. Colón</strong>En la primera parte escuchamos cómo Isaías contempló la gloria y la santidad de Dios. Hoy seguimos con la invitación a conocer sus atributos y a reconocer su presencia también en los momentos cotidianos.<br><small>Introducción original basada en la lectura. Ajústala después de escuchar el audio de Marco.</small></div>";if(d.id===28)return "<div class=\"readerintro\"><strong>Continuidad con Sandra</strong>En la primera parte escuchamos la invitación a servir y la resistencia de Jonás. Hoy continuamos con las inseguridades de Moisés y la disponibilidad de Isaías.<br><small>Introducción original basada en la lectura. Adáptala después de escuchar el audio de Sandra.</small></div>";if(d.id===26)return "<div class=\"readerintro\"><strong>Comenzamos la tercera parte · Envíame</strong>Después de Examíname y Quebrántame, abrimos nuestra oración a la disponibilidad para servir. Con Carla escucharemos la invitación a responder «Aquí estoy».<br><small>Introducción original para enlazar las etapas de la ronda.</small></div>";if(d.id===25)return "<div class=\"readerintro\"><strong>Continuidad con Meriemil</strong>En la primera parte conocimos la experiencia de John y la invitación a apoyarnos en la gracia de Dios. Hoy seguimos con Pedro y con la entrega que se expresa en decisiones de cada día.<br><small>Introducción original basada en la lectura. Adáptala después de escuchar el audio de Meriemil.</small></div>";if(d.id===23)return "<div class=\"readerintro\"><strong>Continuidad con Nanichi</strong>En la primera parte leímos cómo Craig y la familia de Jason vivieron los días posteriores a su pérdida. Hoy seguimos cuando Craig comparte su dolor con la iglesia y pide amor, gracia y compañía.<br><small>Introducción original basada en la lectura. Puede adaptarse después de escuchar el audio de Nanichi.</small></div>";if(d.id===14)return `<div class="readerintro"><strong>Puente narrativo para Richard</strong>«Ayer Marco nos habló de la oración de Jabes: cuánto anhelamos la bendición y la protección de Dios. Hoy Craig Groeschel va un poco más lejos: ¿y si, además de pedir que desaparezcan las pruebas, nos atreviéramos a crecer a través de ellas?».<br><small>Adapta este puente a lo que Marco realmente comparta en su grabación; no es texto del libro.</small></div>`;if(d.id===13)return `<div class="readerintro"><strong>Puente narrativo para Marco A. Colón</strong>«Ayer Keila cerró la primera parte de nuestra ronda con una pregunta esencial: ¿nos atrevemos a pedirle a Dios que nos guíe y a responder a su dirección? Hoy comienza una oración todavía más desafiante: ‘Quebrántame’. Craig Groeschel nos invita a descubrir que también podemos crecer espiritualmente a través de las dificultades».<br><small>Ajusta este enlace a lo que Keila realmente comparta en su grabación; es una introducción original, no texto del libro.</small></div>`;if(d.id===12)return `<div class="readerintro"><strong>Puente narrativo para Keila</strong>«Ayer Sandra nos llevó a recorrer las cuatro peticiones de esta oración y a reconocer el peligro de buscar siempre la aprobación de los demás. Hoy continuaremos desde la respuesta del autor: no basta con reconocerlo, también necesitamos pedirle a Dios que nos transforme y nos guíe».<br><small>Ajusta el puente a lo que Sandra realmente comparta en su audio.</small></div>`;if(d.id===10)return `<div class="readerintro"><strong>Puente narrativo para Carla</strong>«Ayer Lymari nos acompañó a reconocer las excusas con las que a veces justificamos nuestras acciones. Hoy seguimos el capítulo escuchando ejemplos de esas justificaciones y cómo el autor aprendió a aceptar una verdad difícil».<br><small>Personaliza la introducción según lo que Lymari realmente comparta en su audio.</small></div>`;if(d.id===8)return `<div class="readerintro"><strong>Puente narrativo para Lizbeth</strong>«Ayer Ivoncita nos acompañó a reconocer los miedos que pueden mantenernos despiertos, incluso cuando deseamos confiar en Dios. Hoy continuaremos desde el punto donde Craig Groeschel nos recuerda que esas preocupaciones importan y que la fe puede impulsarnos hacia adelante».<br><small>Ajusta este puente a lo que Ivoncita realmente comparta.</small></div>`;if(d.id===6)return `<div class="readerintro"><strong>Puente narrativo para Meriemil</strong>«Ayer Yasmary nos compartió cómo Craig Groeschel oró para que Dios examinara su corazón, y cómo ese momento lo confrontó con una verdad que no esperaba. Hoy descubriremos lo que esa oración le permitió reconocer y cómo empezó a cambiar su rumbo».<br><small>Adapta la introducción a lo que Yasmary realmente comparta en su audio.</small></div>`;if(d.id===4)return `<div class="readerintro"><strong>Puente narrativo para Nanichi</strong>«Ayer Keishla comenzó a acompañarnos en esta oración de David: pedirle a Dios que examine nuestro corazón. Hoy vamos a continuar la lectura allí donde nos quedamos, con algo que quizá nos cuesta reconocer: las historias que nos contamos a nosotros mismos».<br><small>La introducción se ajustará según el audio real de Keishla.</small></div>`;if(d.part==='II'){const first=DAYS[d.id-2];return `<div class="readerintro"><strong>Puente de storytelling · por personalizar</strong>El capítulo continúa desde la lectura del día anterior. Enlaza la reflexión con la voz de ${esc(first.reader)}, sin inventar lo que dijo. El corte exacto sigue pendiente de verificación.</div>`}return ''}
function panel(d){return `<aside class="sidepanel"><h2>Tu guía para grabar</h2><p><strong>Tu día:</strong> ${esc(d.weekday)} ${esc(d.date)} de 2026</p><p><strong>Voz asignada:</strong> ${esc(d.reader)}</p><p><strong>Texto:</strong> ${esc(d.ref)} · ${esc(d.pages)}</p><div class="sectioncut"></div><ol><li>Revisa que la transcripción corresponda a todas tus páginas.</li><li>Comprueba que estén <strong>todas</strong> las páginas asignadas, sin resumir ni saltar párrafos.</li><li>Comienza por <strong>«La Palabra»</strong> y luego lee íntegra la lectura del libro, en el orden indicado.</li><li>Continúa con la reflexión, la oración y la invitación «Dibuja el círculo», sin pedir a los oyentes que compartan respuestas privadas.</li><li>Grábate con tu propia voz y envía el audio a la coordinadora.</li></ol><p class="ref">El texto original transcrito pertenece a <i>Oraciones peligrosas</i>, de Craig Groeschel. Las reflexiones y guías son materiales originales de acompañamiento.</p><div class="sectioncut"></div><div class="sidelinks"><button class="navbtn" onclick="openDay(${Math.max(1,d.id-1)})" ${d.id===1?'disabled':''}>← Anterior</button><button class="navbtn primary" onclick="openHome()">40 días</button><button class="navbtn" onclick="openDay(${Math.min(40,d.id+1)})" ${d.id===40?'disabled':''}>Siguiente →</button></div></aside>`}
function renderDay(n){let d=DAYS[n-1];if(!d){openHome();return}let ready=d.scan_keys.length&&d.scan_keys.every(k=>TRANSCRIPTIONS[k]);let pageStatus=(d.id===25||d.id===26||d.id===32)?d.missing:ready?(d.id===20?'Páginas 83, 84 y 85 transcritas a partir de las fotografías recibidas. El texto termina en «Tenía razón». La página 86 no fue fotografiada; por favor, confírmala en el libro. Las notas laterales se separan para no leerlas dos veces.':d.id===17?'✓ Texto transcrito de las cuatro fotografías de las páginas 73–76. Las notas laterales se muestran aparte para que no se lean dos veces. Consulta las fotografías facilitadas a la coordinación para cotejo editorial.':'Transcripción de trabajo preparada a partir de las fotografías recibidas. Incluye las páginas de la jornada en su orden. Texto preparado para la narración a partir de las fotografías facilitadas a la coordinación.'):d.missing;let readings=ready?d.scan_keys.map(transcribedPage).join(''):`<div class="note">La lectura íntegra del capítulo se incorporará aquí cuando recibamos sus páginas. <strong>No se ha sustituido por un resumen.</strong></div>`;let bg=d.id===17?`<p class="ref">Marcos 14:3–9 · pasaje bíblico relacionado</p><div class="note">Lee en tu Biblia el relato de la mujer que rompió el frasco de alabastro para honrar a Jesús. La interpretación de Craig Groeschel aparece en el capítulo transcrito a continuación.</div>`:d.word?`<p class="ref">${esc(d.wordRef)} · referencia bíblica indicada</p><div class="verse">${esc(d.word)}</div>`:`<div class="note"><strong>Pasaje bíblico por seleccionar.</strong> Lo elegiremos cuando tengamos el capítulo íntegro.</div>`;let tips=d.life?esc(d.life):'Esta reflexión se preparará después de leer el capítulo completo; no sustituye al texto del libro.';let prayer=d.prayer?esc(d.prayer):'La oración original de acompañamiento se preparará cuando tengamos la lectura íntegra.';let circle=d.circle?esc(d.circle):'Prepararemos un círculo creativo y una acción de valentía cuando tengamos y analicemos el capítulo íntegro.';
