TRANSCRIPTIONS["87"]="Mi caja sorpresa finalmente se abrió de una manera innegable y mucho peor de lo que podría haber anticipado. Mi mejor amigo en nuestra iglesia durante esos primeros años fue un chico al que llamaré Jason. Cuando fundamos la iglesia Life.Church, Jason dejó la comunidad de fieles que estaba pastoreando y se mudó a nuestra ciudad para ayudarnos con la nuestra. Como éramos demasiado pequeños para agregar personal y Jason estaba resolviendo algunas cosas en su vida, consiguió otro trabajo y soñamos con que se uniera a nuestro personal algún día en el futuro cercano. Rápidamente se convirtió en mi amigo, confidente y colega ministerial más cercano.\n\nPero como la mayoría de la gente, Jason tenía algunos secretos. Nadie lo sabía en ese momento, pero había hecho algo que lo dejó sintiéndose como si estuviera entre la espada y la pared. Al tratar de maniobrar desde esa situación, tomó una mala decisión que sé que lamentó. Cuando me enteré, no tuve más remedio que hablar con él. Su decisión traicionó mi confianza e hirió nuestra amistad. Cuando le pregunté acerca de lo que hizo, al principio lo negó. Luego, sin ningún lugar donde esconderse, se puso a la defensiva";TRANSCRIPTIONS["88"]="y comenzó a gritarme. Me dijo algunas palabras duras y yo respondí con la misma dureza. Jason salió furioso de la habitación, se subió a su coche y, con rabia, se marchó a toda velocidad.\n\nEl domingo siguiente, no me sorprendió que Jason no se presentara en la iglesia. Y no lo culpé. Había cometido un grave error y luego había dicho algunas cosas que no debería haber dicho. Él estaba molesto. Yo estaba dolido. Pero a pesar de que la traición fue significativa y me sentía traicionado y enojado, Jason seguía siendo mi mejor amigo. Sabía que se calmaría. Eventualmente hablaríamos. Perdonaríamos. Olvidaríamos. Y seguiríamos adelante.\n\nPero esa conversación sanadora nunca sucedió.\n\nAproximadamente dos semanas después, acababa de terminar de predicar un mensaje titulado «Amar a personas complicadas». Jason, naturalmente, vino a la mente, así que, en el camino a casa desde la iglesia, le dije a Amy que lo llamaría esa noche y trataría de arreglar las cosas entre nosotros. Sí, me había lastimado, al igual que a muchos otros, pero era mi mejor amigo. No era perfecto. Yo tampoco. No estaba bien dejar esta distancia entre nosotros.\n\nEn casa, estaba a punto de levantar nuestro teléfono fijo cuando noté que la luz parpadeaba en nuestro contestador automático. Cuando pulsé el botón, escuché a la esposa de Jason llorar. A través de gritos ahogados por las lágrimas, dijo que Jason estaba muerto. Se había quitado la vida.";IMAGES["87"]="assets/ronda14/186a9aa8c60a4ad28a8a.png";IMAGES["88"]="assets/ronda14/4265a3286960c19cb0ed.png";TRANSCRIPTIONS["89"]="Gary me había dicho que sabría cuando estuviera quebrantado, que no necesitaría preguntarle a nadie. En ese momento, al escuchar a la viuda de mi mejor amigo, lo supe sin lugar a duda. La vida sería diferente a partir de ese instante. Nunca volvería a ser el mismo.\n\nPero no fui el único. Todas las personas cercanas a Jason sufrieron, se afligieron y sufrieron de la misma manera. Todos estábamos destrozados, no solo por su pérdida, sino también por las circunstancias que rodearon su fallecimiento. Los siguientes días fueron borrosos. Hicimos nuestro mejor esfuerzo para consolarnos mutuamente, mientras intentamos ayudar a la familia de Jason a tomar decisiones importantes.\n\nDespués de la tragedia, la familia de Jason nunca regresó a la casa donde lo habían encontrado. Su esposa y sus dos hijos se mudaron con nosotros durante su transición. Llorábamos hasta altas horas de la noche y nos quedábamos dormidos cuando estábamos demasiado cansados para seguir llorando.\n\nLos días posteriores a la muerte de alguien son siempre extraños. Mientras estás de duelo, también debes hacer planes para";IMAGES["89"]="assets/ronda14/db42a41a60434675bb2e.png";TRANSCRIPTIONS["90"]="un funeral —un momento para celebrar el amor que acabas de perder. Varios días después, oficié en el funeral. Solo había espacio para estar de pie. A través de mi profundo dolor, de alguna manera traté de ofrecer esperanza a quienes estaban de duelo junto a mí.\n\nAunque nadie lo sabía, las últimas palabras que Jason y yo nos habíamos dicho fueron palabras que ambos lamentaríamos para siempre. Él había actuado mal. Pecó. Mintió. Y traicionó a Dios y a mí. Pero ya no me importaba esa traición. Eso fue solo un momento en el tiempo. Una mala decisión tomada por un hombre desesperado que no vio otro camino.\n\nSin importar lo que él había hecho, yo sabía que debería haber actuado antes para enmendar nuestra amistad. Mi corazón se había endurecido, y mi orgullo obstinado y mi ego herido se interpusieron en el camino para perdonarlo y enfocarme en cómo podría ayudarlo. Invadido por la culpa, lloré durante lo que se sintió como varios días seguidos. Las preguntas inundaban mi mente. ¿Por qué no me dijo que estaba metido en problemas? ¿Por qué no se abrió? En retrospectiva, hubo varias señales de su angustia. ¿Por qué no me di cuenta? ¿Por qué nuestra última conversación tuvo que ser tan terrible? ¿Por qué no lo contacté antes?\n\nEl siguiente domingo traté de predicar. Aunque tenía un sermón planeado y lo comencé, a los pocos minutos supe que no había forma de que pudiera terminarlo. Entonces, frente a una pequeña multitud de personas, rompí a llorar. En uno de los momentos más públicamente transparentes de mi vida, hablé de todo el dolor y el quebrantamiento que habíamos experimentado desde que comenzamos la iglesia.\n\nAntes de la muerte de Jason, me sentía dolido, agotado, abrumado, asustado.\n\nDespués de su muerte, simplemente me sentía destruido, destrozado, roto, marcado.";IMAGES["90"]="assets/ronda14/758afa662ced8595c054.png";TRANSCRIPTIONS["91"]="Entre lágrimas, le dije a la iglesia que me sentía culpable. Culpable de no haber contactado a Jason. Culpable de no haber hecho más. Culpable de no saber que estaba sufriendo. Pero mi culpa llegaba mucho más allá de la tragedia de Jason. Me sentía culpable de no haber sido un mejor padre porque me estaba enfocando demasiado en nuestra iglesia en crecimiento. Y me sentía culpable de no haber sido un mejor pastor porque me esforzaba demasiado por ser suficiente para mi esposa e hijos.\n\nNo importaba cuánto lo intentara, simplemente no era suficiente.\n\nLe dije a la iglesia que me sentía quebrantado y que necesitaba algo más que la oración. Necesitaba amor. Gracia. Los necesitaba como amigos. Y necesitaba de Dios más que nunca.\n\nEse día, algo cambió en nuestra joven iglesia. Pasó de ser una pequeña multitud de personas reunidas a una familia, una verdadera comunidad llena de gracia. Cuando pedí apoyo, casi todos dejaron sus asientos y se acercaron a orar, llorar y adorar. Algunas personas se arrodillaron. Algunas personas levantaron sus manos al cielo. Algunas personas pusieron sus manos sobre nuestros hombros para orar por mí y por nuestra familia. Todos habíamos experimentado la pérdida.\n\nEstábamos quebrantados juntos.\n\nEs fácil impresionar a las personas con nuestras fortalezas, pero las conexiones reales se forjan a través de nuestras debilidades compartidas. Tal vez impresionamos a las personas con lo que podemos hacer. Pero nos conectamos con ellas en nuestras luchas comunes. Esta es una de las bendiciones del quebrantamiento. Podemos luchar para ser fuertes, mostrar lo mejor";IMAGES["91"]="assets/ronda14/07467ad55ad28825e624.png";TRANSCRIPTIONS["92"]="cuando publicamos selfis y nunca dejar que nos vean abatidos. Pero cuando estamos quebrantados juntos, la unión es más profunda de lo que podemos imaginar, especialmente en la familia de Dios. Así como la persecución siempre une, fortalece y alienta a los cristianos que sufren juntos, el quebrantamiento crea un vínculo que resiste la prueba del tiempo.\n\n¿Y si en lugar de evitar el quebrantamiento lo acogiéramos? ¿Le diéramos la bienvenida? ¿Y si incluso lo pidiéramos?\n\n«Quebrántame, Señor».";IMAGES["92"]="assets/ronda14/b99f51abfacba7364162.png";MARGIN_NOTES["91"]="No importaba cuánto lo intentara, simplemente no era suficiente. / Es fácil impresionar a las personas con nuestras fortalezas, pero las conexiones reales se forjan a través de nuestras debilidades compartidas.";TRANSCRIPTIONS["93"]="Durante veinticinco años, he tenido el mismo compañero de entrenamiento. Su verdadero nombre es John, pero lo llamo Paco porque, bueno, Paco me parece un mejor nombre para un compañero de entrenamiento. Aunque Paco es mayor que yo, es un tipo fuerte. Nunca lo he visto lanzar un puñetazo y es demasiado amable para insultar a alguien, pero no tengo ninguna duda de que, si llegara el momento de la verdad, lo querría de mi lado en una pelea callejera.\n\nPuedes suponer que Paco y yo no lloramos juntos.\n\nNo hablamos mucho de nuestros sentimientos.\n\nSomos compañeros de entrenamiento, no compañeros de penas.\n\nPero entonces ocurrió algo. Paco de repente comenzó a experimentar un severo zumbido en sus oídos y fue entonces cuando vi un lado diferente de mi fuerte amigo. No sabía mucho acerca del tinnitus, pero al ver sufrir a Paco, me enteré de lo terrible que puede ser. Para algunos, este zumbido constante nunca se detiene. Y no hay cura. Para los casos más graves (como el de Paco), entiendo que se siente como si un tren pasara por tu cerebro veinticuatro horas al día. ¡Todos los días!";
TRANSCRIPTIONS["94"]="Aunque hay algunos dispositivos que se pueden utilizar, el dolor para muchos es insoportable. Trágicamente, Paco tenía uno de los peores casos que sus médicos habían visto.\n\nDespués de visitar a los mejores expertos y especialistas, Paco recibió el mejor consejo de parte de otra persona que sufría de tinnitus. El hombre le explicó que el ruido jamás desaparecería, y que la única forma en que podría soportarlo era acercándose más a Dios de lo que nunca había estado y dedicando su vida al servicio de otras personas.\n\nParece una locura, ¿cierto? Solo aguanta y sonríe mientras actúas como si todo estuviera bien. Recuerdo cuando Paco me habló del consejo de aquel hombre. Parecía trillado. Inútil. Pero Paco no había visto a otra persona con tinnitus severo funcionar tan bien como este hombre. Entonces, sin nada que perder, lo intentó.\n\nDiariamente se apoyaba en Dios como jamás lo había hecho antes, leyendo la Palabra viva de Dios, meditando en su verdad y amor, adorando, orando, ayunando. John y su esposa, Jennifer, formaron un grupo pequeño y comenzaron a entregarse a otras personas. «Adoptaron» a una madre soltera y a sus hijos y empezaron a servirlos abnegadamente. Y al entregar sus vidas, el rugido en el cerebro nunca mejoró, pero de alguna manera John comenzó a mejorar. El dolor no disminuyó, pero la felicidad de John aumentó.\n\nUn día en el gimnasio estábamos tratando de hacer ejercicio. John me explicó que el tinnitus es el peor dolor que jamás haya podido imaginar. Sin embargo, por la gracia de Dios, nunca había estado más cerca de Él que en ese momento. Me dijo que, en el quebrantamiento, había encontrado la felicidad.\n\nNo estoy seguro de si él comenzó a tener los ojos empañados primero o si fui yo. Pero allí, frente a todos en el gimnasio, dos amigos de toda la vida no pudieron contener sus lágrimas.\n\nEn el quebrantamiento y la entrega de su vida, John encontró esperanza. En medio de su peor dolor, descubrió una paz llegada";
TRANSCRIPTIONS["95a"]="del cielo que no podía explicar. Lo había descubierto por mí mismo. Pero ahora lo veía en él. En nuestro quebrantamiento, a menudo experimentamos las mayores bendiciones de Dios.\n\nLo admito, se necesita una fe tremenda para hacer esta oración. Requiere audacia divina. Y entiendo por qué muchos nunca pedirían ser quebrantados. Pero al otro lado de confiar plenamente en Dios, hay una bendición que no se puede encontrar en la comodidad y la facilidad.\n\nCuando Gary me dijo que sería quebrantado, entré en pánico. Quería evitarlo a toda costa. Pero si hubiera tratado de evitar el dolor, me habría perdido las bendiciones.\n\nEl apóstol Pablo clamó desesperadamente a Dios por la sanación y la salvación de una prueba desconocida. En tres momentos diferentes, Pablo rogó, suplicó y le pidió a Dios que le quitara la prueba. Pero cuando Dios dijo que no, Pablo descubrió algo que de otro modo se habría perdido.*\n\nLa gracia de Dios fue suficiente.\n\n¿A quién usa Dios con más frecuencia? Dios usa a aquellos que están quebrantados y dependen de él.";
TRANSCRIPTIONS["95b"]="Durante la última cena, Pedro escuchó mientras Jesús explicaba que su cuerpo sería quebrantado. Poco tiempo después, luego de que arrestaron a Jesús, Pedro experimentó su quebrantamiento más profundo. Tres veces Pedro negó";
TRANSCRIPTIONS["96"]="siquiera conocer a Cristo. La tercera vez, la Biblia dice que alguien le preguntó a Pedro si estaba con Jesús. «Y Pedro dijo: ‘Hombre, no sé lo que dices’. Y en seguida, mientras él todavía hablaba, el gallo cantó. Entonces, vuelto el Señor, miró a Pedro» (Lucas 22: 60-61).\n\nDurante años, no me había percatado de la última parte: «Entonces, vuelto el Señor, miró a Pedro».\n\nPedro negó conocer a Jesús. Jesús vio la negación. Y sus ojos se encontraron. ¿Puedes imaginar la vergüenza, el dolor, el quebrantamiento que sintió Pedro? Pero luego, cuando Pedro experimentó la gracia de Jesús después de la resurrección, nadie estaba mejor preparado para predicar el día de Pentecostés. Dios eligió a Pedro para que fuera una parte fundamental de su iglesia en la tierra. Para decir a otros que se aparten de sus pecados. Porque Pedro se había apartado del suyo.\n\nAños más tarde, le pidieron a Pedro que negara a Cristo, pero en esa oportunidad Pedro se rehusó. La tradición nos dice que, cuando los enemigos de Cristo querían crucificar a Pedro, él dijo que no estaba dispuesto a morir como murió su Salvador. En cambio, pidió ser crucificado boca abajo. El mismo hombre que se había encogido de miedo en el pasado, se mantuvo firme en la fe. Él era un hombre diferente.\n\nPedro estaba quebrantado y vacío.\n\nTal vez no estemos quebrantados como Pedro, o como nadie más, pero todos enfrentaremos momentos en la vida en los que tenemos que tomar una decisión. Cuando Gary me dijo que sería quebrantado, al principio luché por evitar la idea. A medida que mi confianza y fe en Dios aumentó, no solo lo acepté, sino que también encontré el valor para pedir por ello. Pero había algo sobre el quebrantamiento que yo no entendía.\n\nEl verdadero quebrantamiento ante Dios no es un evento de una sola vez; es una decisión diaria. Pablo dijo: «Cada día muero» (1 Corintios 15:31). ¿Qué significa eso? Todos los días, él eligió";
TRANSCRIPTIONS["97"]="crucificar sus propios deseos para poder vivir plenamente para los de Dios.\n\nTodos estamos llamados a morir diariamente. A ser quebrantados y vaciados. A depender del Espíritu de Dios. A depender de Él para nuestro consuelo, nuestra guía, nuestra fuente de poder.\n\nEstar quebrantado no es solo un momento en el tiempo originado a partir de un evento doloroso. Es una elección diaria morir para el orgullo. Crucificar la lujuria. Destruir el egoísmo. En lugar de vivir una vida cómoda, es una elección vivir una vida de fe.\n\nPuedes experimentarlo cuando haces lo correcto, pero eres criticado por aquellos que no comprenden. O cuando respondes con amor, en lugar de ira, a alguien que te ataca. O cuando haces fielmente algo que crees que Dios te ordenó que hicieras, incluso cuando no tiene mucho sentido e incluso cuando tus compañeros de trabajo se burlan de ti.\n\nSi no quieres hacer esta oración peligrosa, entonces no la hagas. Mucha gente no te culparía. Ten por seguro que yo no lo haré.\n\nPero si tienes el valor de hacerla, prepárate. Prepárate para conocer a Dios y ser conocido por Dios de una manera que no has experimentado antes.\n\nSi enfrentas problemas económicos, apóyate en Dios y confía en su provisión. Si tu vida se cae a pedazos, quebrántate junto a ella. Confía en que Dios será lo que necesitas, que ajustará tu corazón, que guiará tus pasos. Si has recibido un diagnóstico negativo de un médico o tienes miedo por la salud de un ser querido, ora a Jesús, el que curó a los enfermos y realizó milagros en la vida de la gente común.\n\nCuando las cosas se ponen difíciles, muchos huyen de Dios. No hagas eso. Corre hacia Él. Y no luches";
TRANSCRIPTIONS["98"]="contra el quebrantamiento. Deja de intentar parecer fuerte. Sé débil. Sé vulnerable. Sé quebrantado. Es en tu debilidad que descubres su fuerza. En tu quebrantamiento, encuentras sus bendiciones.\n\nPermíteme recordarte que esto no es un cristianismo avanzado. El quebrantamiento no es solo para monjes y misioneros. El quebrantamiento es, en realidad, el primer paso. Es el cristianismo básico. El evangelio es una invitación a venir y morir. Muere a tus pecados. Muere a tu pasado. Muere a tu carne. Y muere a tus miedos.\n\nNo es un compromiso cómodo, a medias, a tiempo parcial con Cristo. Es una sumisión radical y atrevida a su voluntad para tu vida.\n\nPuedes ir a lo seguro. Pero mi instinto me dice que quieres algo más que eso. Yo elijo algo diferente. Soy una persona arriesgada llena de fe que lo apuesta todo. Nunca insultaré a Dios con pensamientos pequeños o con una vida libre de riesgos. Si hay bendiciones al otro lado del quebrantamiento, entonces quebrántame.\n\nCuando la mujer pecadora encontró la gracia de Cristo, quebró su valioso frasco y derramó todo el perfume.\n\nCuando Jesús miró a aquellos que amaba y pensó en los que vendrían, tomó una decisión. Eligió el quebrantamiento. Su cuerpo fue quebrantado por ti y su sangre derramada por tus pecados.\n\n¿Quieres más? ¿Sabes que hay más? ¿Quieres glorificar a Dios? Entonces adelante. Ora. Ve hacia Él.\n\nVive quebrantado y derramado.\n\n¿Estás listo?\n\nSe necesita fe. No se trata de una oración segura. No hay duda de que es peligrosa.\n\nPero las bendiciones más íntimas de Dios te esperan del otro lado.\n\n«Quebrántame, Señor».";

TRANSCRIPTIONS["101"]="Como hijo de un padre muy patriota, aprendí a saludar la bandera estadounidense a una edad temprana. No mucho después de que comencé a quitarme la gorra para el himno nacional y a poner mi mano derecha sobre mi corazón, mi padre también me contó una historia sobre uno de sus presidentes favoritos. Las calles de nuestra capital se encontraban cubiertas con veinte centímetros de nieve en ese día gélido de enero de 1961. John F. Kennedy, el hombre más joven que se ha elegido para nuestro cargo más alto, subió al podio para su toma de posesión sin llevar abrigo ni sombrero. Luego, en un discurso de menos de mil quinientas palabras y de menos de quince minutos, el presidente Kennedy propuso un famoso desafío para las generaciones futuras que todavía resuena hoy: «No preguntes qué puede hacer tu país por ti. Pregunta lo que tú puedes hacer por tu país».\n\nIncluso siendo un niño, cada vez que escuchaba a papá describir esa escena y decir esas palabras, me sentía inspirado. Había algo tan conmovedor para mí en el desafío de JFK, una invitación a ser parte de algo más grande que yo, un pedido para hacer algo más que consumir, sino que contribuir. Años después, esas breves";
TRANSCRIPTIONS["102"]="palabras todavía me inspiran a servir a mi país, pero significan aún más para mí al considerar mi vida de oración ante Dios.\n\nEn lugar de pedirle a Dios que nos sirva a nosotros, ¿qué pasaría si le dijéramos a Dios que estamos disponibles para servirle a Él?\n\nComo pastor, durante varias décadas he seguido de primera mano las peticiones más íntimas de miles de personas. Cada semana, cientos de necesidades inundan nuestra iglesia, desde tarjetas de oración en nuestros servicios hasta llamadas telefónicas durante la semana o solicitudes en línea a través de las redes sociales o la aplicación de nuestra iglesia. Así que no te sorprenderá saber que la frase más común que escucho cada semana es una que estoy encantado de cumplir: «Pastor, ¿podría orar por favor por…».\n\nConsidero un privilegio, un honor y una responsabilidad gratificante hacer una pausa y elevar una necesidad ante el trono de Dios, pidiéndole que tenga misericordia, que conmueva, que guíe, que provea, que actúe, que haga un milagro para las personas que conozco y amo. Cada semana alguien le pide a Dios que sane a su ser querido del cáncer, que ayude a un vecino a encontrar un trabajo o que restaure un matrimonio en problemas. Los estudiantes piden oración para poder ingresar a la universidad de su elección, para ayudar a pagar esa universidad o para lidiar con el dolor del divorcio de sus padres. Algunas personas oran por un cónyuge. Otros piden ayuda para perdonar a una persona que los lastimó. Algunos suplican tener paz durante una dura prueba en la vida. Algunos padres oran por adolescentes que sucumben a las drogas. Algunos hombres, y a veces algunas mujeres, piden ayuda para combatir la adicción a la pornografía, y oran por la sanación de su vergüenza.";
TRANSCRIPTIONS["103"]="Aunque las peticiones varían, la gente le pide a Dios que haga algo por ellos o por alguien que aman. Dios ayúdame. Dios, ayuda a alguien a quien amo. Señor, necesito… Padre, podrías por favor…\n\nDios, haz algo por mí.\n\nAtención, por favor, definitivamente deberíamos orar de esta manera. Siempre debemos invitar a la presencia de Dios, al poder de Dios, a la paz de Dios para que intervenga en nuestras vidas. Debemos pedirle a Dios que haga milagros en nuestro nombre. Debemos elevar a nuestros seres queridos y recordarnos a nosotros mismos cómo Dios puede actuar en sus vidas. Debemos buscar al Señor para todas nuestras necesidades.\n\nPero no debemos detenernos ahí.\n\nEn el espíritu del discurso inaugural de JFK, ¿qué pasaría si nos negáramos a orar únicamente por nosotros mismos? Perdona mi paráfrasis, pero ¿qué pasaría si oramos, «no preguntes qué puede hacer Dios por ti, sino pregúntale a Dios lo que tú puedes hacer por él?».\n\n¿Qué pasaría si en lugar de pedir a Dios que haga algo por nosotros hiciéramos una oración peligrosa, abnegada y de disponibilidad a nuestro Padre celestial? ¿Qué pasaría si en lugar de pedir siempre a Dios que haga algo por nosotros, nos atreviéramos a pedirle que nos use en su nombre? ¿Qué pasaría si tuviéramos la fe valiente para entregar todo nuestro futuro —comenzando ahora mismo— a Dios? Diciéndole que somos completamente suyos. Que estamos disponibles. De guardia.\n\nA la espera para bendecir a alguien, servir a alguien, dar todo lo que podamos dar a alguien.\n\n¿Y si hiciéramos tal vez la oración más peligrosa de todas?\n\n«Envíame, Señor. Úsame».";

TRANSCRIPTIONS["105"]="Si te digo que «alguien me llamó», probablemente asumirías que un amigo, pariente o miembro de la iglesia marcó mi número de celular con la esperanza de hablar conmigo o dejar un mensaje (sí, todavía puedes usar su teléfono para hacer llamadas a otras personas, aunque parece que se utilizan cada vez menos para ese propósito). Mucho antes de los teléfonos, fijos y móviles, había otro tipo de «llamada»: una invitación de Dios para servirle, por lo general de una manera específica y única. Su llamada generalmente requiere que renuncies a tus propios planes y preferencias y vayas donde Él te diga, cuando Él te diga, como Él te diga, para conocer a quien Él te diga y hacer lo que Él te diga.\n\nRendición completa.\n\nNo es fácil responder a ese llamado, de modo que podríamos sentirnos tentados a pensar en muchas excusas. Incluso podríamos pensar correctamente que no estamos calificados, que somos inadecuados o que no estamos preparados para hacer lo que Dios nos pide que hagamos. Pero no hay problema. Mira, Dios nunca llama a personas perfectas. Dios llama a hombres y mujeres imperfectos y débiles como tú y como yo. Simplemente desea personas";
TRANSCRIPTIONS["106"]="dispuestas a ser sus instrumentos y los invita a usar sus vidas para hacer una diferencia por Él.\n\nSiempre que me siento inadecuado o incompetente, recuerdo que Dios llamó a Moisés, un asesino; a David, un adúltero; y a Rajab, una prostituta. Dios no solo llamó a las personas que hicieron cosas realmente malas, sino que también llamó a personas inusuales, inseguras e inconsistentes. Considera algunos de los mensajeros, ministros, profetas y líderes elegidos por Dios. Está Noé, que se emborrachó; Isaac, que era un soñador; José, que fue abandonado; y Gedeón, que tenía miedo. Está Jeremías, que era demasiado joven, y Abraham, que era demasiado viejo. Elías, quien luchaba contra la depresión. Noemí, que se volvió amargada. Martha, que era aprensiva. Y Juan el Bautista, que comía bichos.\n\nNo son exactamente los Vengadores, esta gente. Muy lejos de cualquier colección de súper santos. Pero aun así Dios los llamó y los usó a pesar de que estaban lejos de ser perfectos.\n\nDios no ha cambiado. El mismo Dios que llamó a las personas imperfectas todavía lo hace. Ahora te está llamando. Invitándote, empujándote, animándote. El llamado de Dios te impulsa a vivir más allá de ti mismo, a que no solo vivas en función de tu propia comodidad, sino a que te entregues completamente a sus órdenes. Te anima a ir. Servir. Construir. Amar. Luchar. Orar. Compartir. Liderar.\n\nEntonces, ¿cómo respondes cuando Dios te llama? En el Antiguo Testamento, vemos al menos tres respuestas diferentes. El profeta Jonás representa una de las respuestas más comunes: «Aquí estoy, Señor, pero no voy a ir».\n\nCuando el Dios del universo vio una necesidad en la ciudad de Nínive, eligió a Jonás para que fuera a predicar a los pecadores y rebeldes de allí. Jonás tenía los dones. Tenía el poder. Tenía la";
TRANSCRIPTIONS["107"]="habilidad. El problema es que no tenía la disponibilidad. Jonás no estaba dispuesto y rotundamente dijo a Dios «No». Y, por favor, comprende que cuando Dios habló, su encargo era claro: «Ve a Nínive, aquella gran ciudad, y pregona contra ella; porque ha subido su maldad delante de mí» (Jonás 1:2).\n\nJonás podría haber dicho: «Sí, cualquier cosa por ti, Dios. Tú eres mi Señor y haré lo que me pidas». Pero eso no sucedió. En lugar de tener un corazón dispuesto, Jonás se resistió. No solo dudó y puso excusas; se escapó de Dios (ver Jonás 1:3). Y tengo que preguntarme, ¿Jonás realmente pensó que podía alejarse lo suficiente? ¿O fue solo un caso de cultivar la negación momento a momento para evitar la verdad? Ocultando tu cabeza en la arena, o en el caso de Jonás, en el vientre de un pez grande. Intentando fingir, esperando que Dios simplemente se vaya. O que cambie de opinión sobre lo que te ha llamado a hacer.\n\n¿Alguna vez has respondido de esta manera? Tal vez sentiste la inspiración de Dios, una invitación a hacer algo en su nombre. Pudo haber sido algo pequeño como dar un regalo o compartir un pensamiento. Pudo haber sido algo más significativo como cambiar de carrera o pedirle a alguien que se case contigo. Pero como Jonás, vacilaste. Postergaste. Luego cambiaste de rumbo.\n\nYo sé que he hecho esto. Una vez estaba conduciendo a casa desde el trabajo. Aunque mi familia vive a poca distancia en auto de la ciudad, vivimos cerca de miles de acres de terrenos que no han sido urbanizados. No es inusual conducir por carreteras secundarias sin ver un solo automóvil o camión pasar. Así que un día, conduciendo a casa, me sorprendió ver a una señora mayor, de unos sesenta años o más, parada sola a un lado de la carretera, sin ningún coche cerca que pudiera haberse averiado. Solo esta señora, parada allí junto a la zanja.\n\nYo estaba desconcertado. ¿Qué hace aquí en medio de la nada? ¿Está perdida? ¿Busca algo? ¿Espera a alguien? ¿Está simplemente";
TRANSCRIPTIONS["108a"]="paseando? Parece extraño. Todo dentro de mí me decía que me detuviera para ver cómo estaba y preguntar si necesitaba ayuda. Si bien estoy seguro de que sentí que Dios me impulsaba a detenerme, también sabía que era una cuestión de sentido común, de decencia humana básica.\n\nPero seguí conduciendo.\n\n¿Por qué no me detuve? ¿Por qué no le pregunté si estaba bien? ¿Si podía ayudar en algo? No tengo la menor idea. Traté de justificarlo. Seguro que está bien. Nadie estaría en este camino sin ningún motivo. Ella no me hizo señas ni me llamó.\n\nEste momento de egoísmo me ha perseguido desde entonces. ¿Por qué no me detuve? ¿Por qué no obedecí lo que sentí? ¿Por qué no ofrecí ayuda? Después de todo, soy un pastor. Se supone que soy un sirviente de Dios. Su instrumento, sus manos y pies. Pero, como Jonás, adopté una postura egoísta: «Aquí estoy, Señor. No voy a ir».";
TRANSCRIPTIONS["108b"]="La segunda respuesta al llamado de Dios puede que no sea tan rebelde en apariencia, pero es igual de peligrosa para nuestra salud espiritual. Cuando Dios vio el poder opresivo de Faraón sobre el pueblo escogido de Dios, llamó a Moisés. Dios dijo: «Ven, por tanto, ahora, y te enviaré a Faraón, para que saques de Egipto a mi pueblo, los hijos de Israel» (Éxodo 3:10). No podría ser más claro, ¿verdad? Dios dijo, «Te estoy enviando a ti. ¡Ahora ve! De todas las personas que están vivas hoy, tú eres a quien yo seleccioné. Eres a quien yo llamé. Tienes lo que se necesita. Te estoy enviando a ti».\n\nPero Moisés tuvo una respuesta diferente a la de Jonás. En lugar de vivir en la confianza del llamado de Dios, Moisés estaba enterrado en sus propias inseguridades. Cuando Dios llamó a su instrumento elegido, Moisés respondió: «¿Quién soy yo para que vaya";
TRANSCRIPTIONS["109"]="a Faraón, y saque de Egipto a los hijos de Israel?» (Éxodo 3:11). Entonces Moisés dijo rápidamente a Dios todas las razones por las que no era la persona adecuada. «No soy un buen orador. Tartamudeo. No soy lo suficientemente bueno. Alguien más sería mucho mejor que yo».\n\nTodavía hacemos esto hoy. Cuando Dios nos desafía a dar más, decimos: «Pero Dios, no tengo mucho para mí mismo. Otros pueden dar más». Cuando Dios nos llama a servir, tal vez argumentemos: «No tengo suficiente tiempo. Seguro que hay mejores candidatos para este puesto que yo». Cuando Dios nos impulsa a hacer algo, nos sentimos tentados a darle todas las razones por las que no somos su mejor persona. No sabemos lo suficiente. No tenemos el talento suficiente. No somos lo suficientemente buenos. Hay muchas otras personas mejor calificadas para esto que nosotros.\n\nAquí estoy, Dios, pero envía a otra persona.\n\nHay otra respuesta. Y esta no es solo una declaración a Dios, sino que es una oración. Y como probablemente adivinaste, es peligrosa. No es una oración segura, benigna o egocéntrica. Esta oración requiere una gran fe. Es arriesgada porque casi siempre te llevará a la acción. Probablemente te lleve a hacer algo que no va a parecer natural o fácil. Hará que salgas de tu zona de confort.\n\nIsaías hizo tal oración de disponibilidad sin reservas en la presencia de Dios. El profeta del Antiguo Testamento relata su encuentro con el Santo cuando Dios preguntó: «¿A quién enviaré, y quién irá por nosotros?» (Isaías 6:8a) Y sin conocer los detalles, sin saber cuándo ni dónde, Isaías hizo esta asombrosa oración que cambió su vida: «Aquí estoy yo. Envíame a mí» (Isaías 6:8b NTV).";
MARGIN_NOTES["106"]="Dios nunca llama a personas perfectas. Dios llama a hombres y mujeres imperfectos y débiles como tú y como yo.";
MARGIN_NOTES["108b"]="En lugar de vivir en la confianza del llamado de Dios, Moisés estaba enterrado en sus propias inseguridades.";
TRANSCRIPTIONS["111"]="Seamos honestos. Decirle a Dios que harás lo que Él quiera que hagas da miedo. ¿Cierto? Recuerdo de adolescente haber hablado con mis amigos sobre este tipo de disponibilidad cuando estaba en el grupo de jóvenes de la iglesia. Uno de mis amigos estaba convencido de que Dios lo enviaría a África como misionero, donde estaría arruinado, nunca volvería a ver la electricidad y tendría que ir al baño en un agujero en el suelo. Otro chico sabía que tendría que casarse con una chica cristiana que no encontraba atractiva. Recuerdo que yo pensé que, si hacía esa oración peligrosa, Dios podría convertirme en pastor o algo horrible como eso. (¡Qué te parece esto como una advertencia de que esta oración es peligrosa!).\n\n¿Cómo puedes simplemente hacer lo que Dios quiere? ¡Él podría pedirte que hagas algo que jamás querrías hacer! Algo abrumador. Algo desagradable.\n\nEste tipo de oración peligrosa de sumisión no es fácil de hacer, especialmente si no tienes una profunda confianza y reverencia por Dios. Pero cuando conozcas a Dios, su carácter, su naturaleza, su santidad, estarás más dispuesto a ofrecer esta oración. De hecho,";
TRANSCRIPTIONS["112"]="cuando experimentes a Dios por quien realmente es, disfrutarás de orar con esa vulnerabilidad.\n\nIsaías no hizo esta oración en un vacío. No surgió de la nada y sin motivo. En el primer versículo de su libro, Isaías establece el contexto, explicando que su encuentro con Dios tuvo lugar en el año en que murió el rey Uzías. Dado que Uzías era un rey amado y de confianza, Israel cayó en una temporada de caos, confusión y desesperación sin su líder popular. Así que habría sido lógico que Isaías comenzara su profecía con algo dramáticamente siniestro. Pudo haber dicho: «En el peor año de nuestra nación…». O podría haber escrito: «En el año en que todos perdimos la esperanza…».\n\nSin embargo, durante este tiempo de desesperación y temor, Isaías escribió: «El año en que murió el rey Uzías, vi al Señor sentado en un majestuoso trono, y el borde de su manto llenaba el templo» (Isaías 6:1). Isaías no solo leyó acerca de Dios o escuchó a otros hablar de Dios. Él vio al Señor. Experimentó la presencia de Dios de una manera única. Si vas a pedir a Dios que te use, un encuentro genuino con Él ayudará mucho a que confíes en Él.\n\nPodrías sentir la presencia de Dios mientras lees su Palabra. Podrías reconocer que Él está contigo mientras adoras en la iglesia. Podrías encontrarte abrumado por su bondad mientras estás sentado en la cima de una montaña disfrutando de su creación. Podrías descubrir que Él está contigo y que te otorga palabras para decirlas cuando estás compartiendo tu fe con un amigo. O podrías sentirte completamente solo en una época difícil de tu vida. Pero de repente te das cuenta de que no estás realmente solo. Dios no solo está contigo en tu dolor, sino que siempre ha estado ahí.";
TRANSCRIPTIONS["113a"]="Isaías vio al Señor. Y en la presencia de Dios, Isaías quedó atónito. Estaba conmocionado. Estaba asombrado. Dios estaba alto y sublime. Dios estaba en su trono. El borde de su manto llenaba el templo.\n\nEl profeta hizo todo lo posible por usar palabras humanas para describir a las criaturas celestiales que rodeaban a Dios, alabando su nombre. Isaías los llamó serafines, seres angelicales y ardientes con seis alas que rodeaban al Señor Dios. Debido a la santidad del Señor, estos seres celestiales se cubrían el rostro con dos de sus alas para protegerse de la gloria del Dios Altísimo. Estos adoradores se gritaban unos a otros a viva voz, clamando: «¡Santo, santo, santo es el Señor de los Ejércitos Celestiales! ¡Toda la tierra está llena de su gloria!» (Isaías 6:3). Sus voces retumbaban tan alto que los postes de las puertas temblaron y el templo tembló. Y la gloria de Dios llenó el templo.\n\n¿Cuándo fue la última vez que tuviste tal encuentro con Dios que te quedaste maravillado por su gloria y santidad? Con demasiada frecuencia en estos días, muchas personas lo tratan de manera casual, incluso trivial. Familiarizados con percepciones populares acerca de Él, pero inconscientes de su santidad, muchas personas dan a Dios por sentado.";
TRANSCRIPTIONS["113b"]="Para algunas personas, Él es «el de arriba» o el «tipo grande del cielo». Pero estas imágenes de Dios ni siquiera se aproximan a mostrarle al Señor el respeto, la gloria y el honor que se merece. Si alguna vez has tenido una verdadera visión de Dios en su esencia más pura, te prometo que nunca te referirías a Él como a un amigo cualquiera.\n\nDios es demasiado poderoso para faltarle el respeto. Es demasiado santo para tratarlo de manera informal. Es demasiado bueno";
TRANSCRIPTIONS["114"]="para hablarle con familiaridad ingrata. Es demasiado majestuoso para darlo por sentado.\n\nPermíteme darte una idea de quién es Dios. Por favor, lee sobre sus atributos lentamente. Date tiempo para digerirlos. Deja que te maravillen. Deja que te abrumen. Pon atención a lo que sucede en tu corazón a medida que te vuelves un poco más consciente de su bondad, su gracia, su gloria. Conócelo más íntimamente. Acoge su santidad. Asómbrate ante su grandeza y gloria.\n\nMedita sobre su carácter. Considera que Dios es el Creador del cielo y de la tierra (Génesis 14:19). La Escritura lo llama Dios de gloria (Salmo 29:3), el gran YO SOY (Éxodo 3:14) y Padre justo (Juan 17:25). Dios es nuestra fortaleza de salvación (Salmo 28:8) y el Rey eterno (Jeremías 10:10). Él es el Dios de toda consolación (2 Corintios 1:3), el Dios de toda gracia (1 Pedro 5:10) y el Dios de paz (1 Tesalonicenses 5:23). Él es el Todopoderoso (Génesis 49:25), compasivo y misericordioso (Éxodo 34:6) y es fuego consumidor (Deuteronomio 4:24).\n\nPodría continuar —y podría acercarte a su presencia para buscar y meditar sobre otros atributos de Dios. Encuentro útil personalizar la presencia y los atributos de Dios. Él no es solo nuestro Dios, sino que también es mi Dios. Si conoces a Cristo, si has dedicado tu vida a seguirlo como discípulo, Él también es tu Dios.\n\nSiente el poder de su presencia. Si su Espíritu mora dentro de ti, puedes decir con confianza: Él es mi Roca (Salmo 42:9). Él es mi Salvador (Salmo 18:46). Él es mi fortaleza (Salmo 144:2). Mi Dios es el que borra nuestros pecados (Isaías 43:25), y Él es mi Dios que me consuela cuando estoy herido (Isaías 66:13). El Rey del universo es mi testigo (Job 16:19). Él es mi consolador en el dolor (Jeremías 8:18). Él es mi confianza cuando no estoy seguro (Salmo 71:5). Él es mi fuerza cuando estoy débil (2 Corintios 12:10). Dios es mi auxiliador (Salmo 118:7), mi escondite (Salmo 32:7), mi esperanza (Salmo 25:5, 21), mi luz (Salmo 27:1), Él es mi refugio en";
TRANSCRIPTIONS["115"]="tiempos de angustia (Salmo 59:16), Él es mi canción (Éxodo 15:2 NTV), y es mi potente salvador (Salmo 140:7).\n\nDios es santo, apartado y perfecto en toda su gloria.\n\nTan santo es Dios que no puede ver el pecado (Habacuc 1:13).\n\nTan santo es Dios que el hombre mortal no puede mirarlo en su esencia más pura y seguir viviendo (Éxodo 33:20).\n\nY este Dios santo y de otro mundo es tardo para la ira y grande en amor (Éxodo 34:6). No solo por la humanidad, sino por ti.\n\nCuando te des cuenta de su presencia, no vas a ser el mismo.\n\nAlgunos podrían resistir diciendo: «Muy bien, Craig. Lo entiendo. Si viera a Dios como lo vio Isaías, podría estar dispuesto a hacer esa oración peligrosa también. Pero nunca he experimentado la presencia de Dios de esa manera. Mi tiempo con el Señor no tiene esa clase de drama». Pues bien, déjame animarte a que reconsideres tu tiempo con Dios. No solo es posible experimentarlo como Isaías lo experimentó, sino que Dios quiere revelarse ante ti.\n\nSantiago, el medio hermano de Jesús, nos instruye a acercarnos a Dios y promete que Dios nos encontrará cuando lo hagamos. Santiago dijo: «Acercaos a Dios, y él se acercará a vosotros» (Santiago 4:8). En el Antiguo Testamento, Dios estaba hablando de la oración, explicando que escucha cuando su pueblo ora. Entonces Dios promete osadamente a sus hijos que lo encontrarás cuando lo busques con todo tu corazón (ver Jeremías 29:13).\n\nDios no está jugando a las escondidas. Quiere que lo conozcas y se deleita en mostrarse ante ti. Búscalo. Acércate a Él. Clama a Él. Él está allí.\n\nLo experimentarás cuando lo busques, estés atento a Él y clames a Él. Es posible que sientas su presencia mientras conduces por la carretera cantando una canción de adoración. Puedes sentir su presencia cuando te maravillas ante su creación, admirando su";
TRANSCRIPTIONS["116"]="trabajo mientras el sol sale brillante por la mañana. Tal vez notes que Él está contigo durante una simple oración con tus hijos antes de dormir. Los postes de la puerta no tienen que temblar para saber que Él está contigo. Puede ser un simple conocimiento de que Él nunca te abandona y que nunca te desamparará.\n\nTal vez sientas su presencia de una manera sobrenatural. Puede que sepas que Él está contigo. Pero incluso si no lo sientes, puedes estar seguro de que está contigo. A veces sabes que está contigo, no por una sensación, sino por fe. ¿Cómo puedes aproximarte no solamente a orar, sino también a vivir esta oración peligrosa?\n\nComienza por experimentar la presencia de Dios.";
